name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check sprites.js
          node --check days.js
          node --check days-ch2.js
          node --check days-ch3.js
          node --check days-ch4.js
          node -e "const h=require('fs').readFileSync('index.html','utf8');const m=h.match(/<script>\n([\s\S]*?)<\/script>/);require('fs').writeFileSync('/tmp/inline.js',m[1]);"
          node --check /tmp/inline.js
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html sprites.js days.js days-ch2.js days-ch3.js days-ch4.js title.png favicon.png apple-touch-icon.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
