<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Getting Secure It デモ</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--surface:#14161f;--ink:#eef0ff;--muted:#a6abd4;--line:#8d93cc;--soft:#20233a;
  --gold:#f2c14e;--danger:#ff6d7a;--safe:#6fd38a;--accent:#97adff;--on-accent:#07080d;
  --win-bg:#000000;--win-ink:#ffffff;--win-line:#ffffff;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#dfe6f1;--surface:#ffffff;--ink:#1d2042;--muted:#555b7e;--line:#1d2042;--soft:#cdd6e8;
  --gold:#a86e00;--danger:#c42f3c;--safe:#23793a;--accent:#3552c4;--on-accent:#ffffff;
  --win-bg:#10123a;--win-ink:#ffffff;--win-line:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px}
.chap{font-size:12px;color:var(--muted);line-height:1.3}
.dayl{font-size:18px;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:16px 14px 110px}
body.talking main{padding-bottom:250px}
h2{font-size:20px;font-weight:400;margin:4px 0 4px}
h3{font-weight:400}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.box{background:var(--surface);border:3px solid var(--line);padding:14px;margin:12px 0 14px}
.btn{font:inherit;color:var(--ink);background:var(--surface);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:8px 14px;cursor:pointer;min-height:44px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{font:inherit;font-size:13px;line-height:1.3;background:none;border:0;color:var(--muted);padding:10px 4px;min-height:56px;position:relative;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
.tabs .dot{position:absolute;top:7px;right:calc(50% - 32px);width:10px;height:10px;background:var(--danger)}
.win{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:7;max-width:680px;margin:0 auto;text-align:left;font:inherit;font-size:16px;line-height:1.8;background:var(--win-bg);color:var(--win-ink);border:4px solid var(--win-line);outline:4px solid var(--win-bg);padding:10px 16px 24px;min-height:112px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:start;width:auto}
.win[hidden]{display:none}
.wface{display:block;width:48px;min-height:48px;padding-top:4px}
.wface:empty{width:0;min-height:0}
.who{display:block;font-size:13px;opacity:.75}
.more{position:absolute;right:14px;bottom:4px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.addr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:3px solid var(--line);background:var(--surface);padding:6px 10px;font-size:14px;margin:8px 0 14px}
.warn{color:var(--danger)}
.secure{color:var(--safe)}
.spr{display:block;image-rendering:pixelated}
.voice{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:12px 0;border-bottom:2px dashed var(--soft)}
.voice:last-child{border-bottom:0}
.voice .vn{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border:2px solid var(--muted);padding:0 6px;margin-left:6px}
.netsvg{width:100%;height:auto;display:block;background:var(--surface);border:3px solid var(--line)}
.lbl{font-size:12px;fill:var(--ink);font-family:inherit}
.pl{font-size:10px;fill:var(--ink);font-family:inherit}
.warnT{fill:var(--danger)}
.okT{fill:var(--safe)}
.tapline{animation:tapflow .9s linear infinite}
@keyframes tapflow{to{stroke-dashoffset:-16}}
.atk-hit{animation:atkpulse .45s ease}
@keyframes atkpulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.tapline{animation:none}.atk-hit{animation:none}}
.log{background:var(--win-bg);color:#c9cff5;border:3px solid var(--line);padding:10px 12px;font-size:14px;line-height:1.7;min-height:150px;margin:12px 0;overflow-wrap:anywhere}
.log .bad{color:#ff8a94}
.log .ok{color:#7ee59a}
.log .info{color:#c9cff5}
.loghead{font-size:13px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:8px}
.sec{border:3px solid var(--line);background:var(--surface);margin:12px 0 14px}
.sec h3{margin:0;padding:8px 12px;background:var(--soft);font-size:16px;border-bottom:3px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-bottom:2px dashed var(--soft);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .desc{flex:1 1 180px}
.row .note{display:block;font-size:12px;color:var(--muted)}
.sw{font:inherit;min-width:72px;min-height:40px;border:3px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.sw[aria-pressed="true"]{background:var(--safe);color:var(--surface)}
.sw:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:4px 8px;min-height:44px}
select:disabled{opacity:.45}
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px dashed var(--soft);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk .note{font-size:12px;color:var(--muted);margin-left:auto}
.opt{display:grid;grid-template-columns:24px 1fr;gap:4px 10px;align-items:start;padding:10px 12px;border-bottom:2px dashed var(--soft);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.opt.on{background:var(--soft)}
.optl{grid-column:2;font-size:15px}
.optc{grid-column:2;display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--win-bg);color:#c9cff5;border:2px solid var(--line);padding:4px 8px;margin:2px 0;overflow-x:auto;white-space:pre;overflow-wrap:normal}
.optn{grid-column:2;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:10px 0}
.item{background:var(--surface);border:3px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item .iname{line-height:1.3}
.item .iprice{color:var(--gold)}
.btn.mini{font-size:12px;min-height:34px;padding:4px 8px;box-shadow:2px 2px 0 var(--line)}
.leak{border:3px solid var(--danger);background:var(--surface);padding:10px 12px;margin:10px 0}
.leakhd{color:var(--danger);font-size:14px;margin-bottom:8px}
.leakrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:2px dashed var(--soft);font-size:14px}
.leakrow:last-of-type{border-bottom:0}
.leakrow .lmail{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:13px}
.browser{border:3px solid var(--line);background:var(--surface);margin:12px 0 16px;box-shadow:4px 4px 0 var(--line)}
.chrome{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--soft);border-bottom:3px solid var(--line)}
.dots{display:flex;gap:5px;flex:none}
.dots i{display:block;width:10px;height:10px;border:2px solid var(--line);border-radius:50%;background:var(--surface)}
.urlbar{flex:1 1 auto;display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;min-width:0}
.urlbar .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reload{flex:none;cursor:pointer;display:flex;padding:2px}
.viewport{background:var(--surface)}
.store-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:2px solid var(--soft)}
.store-head .sh-name{display:flex;flex-direction:column;min-width:0}
.store-head .nm{font-size:17px;line-height:1.3}
.store-head .tag{font-size:11px;color:var(--muted)}
.store-head .cart{margin-left:auto;flex:none;font-size:12px;border:2px solid var(--line);padding:4px 8px;background:var(--bg)}
.hero{display:flex;flex-direction:column;gap:2px;padding:16px 14px;background:var(--accent);color:var(--on-accent)}
.hero-t{font-size:18px;line-height:1.3}
.hero-s{font-size:12px;opacity:.85}
.store-search{display:flex;gap:8px;padding:12px 12px 4px}
.store-search input{flex:1 1 auto;min-width:0}
.store-body{padding:4px 12px 8px}
.store-body .grid{padding:8px 0}
.store-foot{padding:12px;margin-top:4px;border-top:2px solid var(--soft);font-size:11px;color:var(--muted);text-align:center}
.checkout{margin:4px 12px 0;border:2px solid var(--line)}
.co-head{padding:8px 12px;background:var(--soft);border-bottom:2px solid var(--line)}
.co-item{display:flex;align-items:center;gap:10px;padding:10px 12px}
.co-item .co-name{flex:1 1 auto}
.co-item .co-price{color:var(--gold)}
.co-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px}
.devtools{margin:12px 12px 0;border:1px solid #3c4043;background:#202124;color:#e8eaed;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;border-radius:6px 6px 0 0;overflow:hidden}
.dt-win{display:flex;align-items:center;gap:7px;background:#292a2d;border-bottom:1px solid #3c4043;padding:6px 10px;color:#9aa0a6;font-size:11px}
.dt-win i{display:block;width:8px;height:8px;border-radius:50%;background:#5f6368}
.dt-win .t{margin-left:4px}
.dt-win .f12{margin-left:auto;border:1px solid #5f6368;border-radius:3px;padding:0 5px;line-height:16px}
.dt-tabs{display:flex;background:#292a2d;border-bottom:1px solid #3c4043;overflow-x:auto;white-space:nowrap}
.dt-tabs .t{padding:7px 11px;color:#9aa0a6;border-bottom:2px solid transparent;flex:0 0 auto}
.dt-tabs .t.on{color:#8ab4f8;border-bottom-color:#8ab4f8}
.dt-reqhead,.dt-req{display:grid;grid-template-columns:1fr auto auto;align-items:center}
.dt-reqhead{background:#292a2d;color:#9aa0a6;border-bottom:1px solid #3c4043}
.dt-reqhead span{padding:4px 10px}
.dt-req span{padding:6px 10px;color:#e8eaed}
.dt-req{background:#0b57d0;border-bottom:1px solid #3c4043}
.dt-req span{color:#fff}
.dt-sub{display:flex;background:#292a2d;border-bottom:1px solid #3c4043;overflow-x:auto;white-space:nowrap}
.dt-sub span{padding:6px 11px;color:#9aa0a6;border-bottom:2px solid transparent;flex:0 0 auto}
.dt-sub span.on{color:#e8eaed;border-bottom-color:#8ab4f8}
.dt-pl{padding:9px 10px 11px}
.dt-pl .ttl{color:#9aa0a6;margin:0 0 7px;font-size:11px}
.dt-kv{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin:5px 0}
.dt-kv>span{color:#9aa0a6}
.dt-kv input{font:inherit;background:#202124;color:#e8eaed;border:1px solid #5f6368;border-radius:3px;padding:4px 6px;min-height:34px;width:100%}
.dt-expl{margin:0 12px 0;border:3px solid var(--line);border-top:0;background:var(--surface);padding:11px 12px}
.dt-expl p{margin:0 0 9px;font-size:13px;line-height:1.7}
.dt-expl p:last-child{margin-bottom:0}
.dt-acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 9px}
.dt-ok{font-size:13px;margin:0;color:var(--safe)}
.dt-expl .btn{margin:0}
.rvwrap{margin:4px 12px 0;border:2px solid var(--line)}
.rvlist{padding:0 12px}
.rv{padding:10px 0;border-bottom:2px dashed var(--soft)}
.rv:last-child{border-bottom:0}
.rv-top{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.rv-top b{font-size:13px}
.rv-star{color:var(--accent);font-size:12px;letter-spacing:1px}
.rv-txt{font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.rv-bad{background:rgba(226,88,94,.1);margin:0 -12px;padding-left:12px;padding-right:12px}
.rv-ran{color:var(--danger)}
/* 解説カード（偽ブラウザの枠の外。ゲーム内の説明であることを明示） */
.hj-meta{margin:0 0 10px;border:2px solid var(--line);border-left:6px solid var(--accent);background:var(--soft);padding:10px 12px}
.hj-meta p{margin:0;font-size:13px;line-height:1.7}
.hj-meta-h{display:inline-block;font-size:11px;font-weight:bold;color:var(--on-accent);background:var(--accent);padding:1px 8px;margin-bottom:7px}
.hj-meta.danger{border-left-color:var(--danger)}
.hj-meta.danger .hj-meta-h{background:var(--danger);color:#fff}
.hj-steal-c{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#000;color:#9cff9c;border:2px solid var(--line);padding:6px 8px;margin:6px 0 0;overflow-x:auto;white-space:pre}
.hj-back{margin:0 0 4px}
/* 偽ブラウザの中身＝飛ばされた先の別サイト（全体まっ黒で、お店とは別物と一目でわかる） */
.browser.evil{border-color:var(--danger);box-shadow:4px 4px 0 var(--danger)}
.browser.evil .chrome.danger{background:#1b0d0f}
.browser.evil .chrome .dots i{background:#000;border-color:#5a2b2f}
.browser.evil .urlbar.danger{background:#000;border-color:var(--danger);color:#ff8f93}
.browser.evil .urlbar.danger .u{color:#ff8f93}
.urlbar.danger .tri{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;background:var(--danger);color:#fff;font-weight:bold;font-size:11px}
.browser.evil .viewport{background:#120407;color:#f0e6e6;animation:hjIn .45s steps(6,end)}
.hj-load{padding:44px 16px;text-align:center;color:#b08a8a;font-size:13px;background:#120407}
.evil-head{display:flex;align-items:center;gap:8px;padding:12px;background:#2a0006;color:#ffd23f;font-weight:bold;font-size:17px;border-bottom:2px solid #5a0010;letter-spacing:1px}
.evil-logo{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;background:#ffd23f;color:#000;border-radius:3px}
.evil .phish{padding:14px 12px}
.evil .phish-h{font-weight:bold;font-size:15px;color:#fff}
.evil .phish-f{display:block;margin:10px 0 0}
.evil .phish-f span{display:block;font-size:12px;color:#9a9aa3;margin-bottom:3px}
.evil .phish-f input{width:100%;background:#15151b;color:#e7e7ea;border:2px solid #3a3a46}
.evil .phish .btn{margin-top:12px;background:#ffd23f;color:#000;border-color:#ffd23f;box-shadow:3px 3px 0 #3a2a00}
@keyframes hjIn{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.browser.evil .viewport{animation:none}}
.leakwrap{margin:4px 12px 0;border:2px solid var(--line)}
.dbdump{padding:0 12px}
.dbval{font-family:ui-monospace,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;color:var(--ink)}
.ordpage{margin:12px}
.ordpage-h{font-weight:bold;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ordmine{font-size:11px;font-weight:bold;border:2px solid var(--safe);color:var(--safe);padding:0 6px}
.ordother{font-size:11px;font-weight:bold;background:var(--danger);color:#fff;padding:1px 6px}
.orow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:2px dashed var(--soft);font-size:14px;flex-wrap:wrap}
.orow:last-child{border-bottom:0}
.orow>span{color:var(--muted)}
.idor-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px 0}
.idor-id{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:70px;text-align:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,6,20,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal[hidden]{display:none}
.sheet{max-width:620px;width:100%;max-height:100%;overflow:auto;background:var(--surface);border:4px solid var(--line);padding:18px}
.sheet h2{font-size:22px}
.sheet ul{padding-left:1.2em;margin:8px 0 14px}
.sheet li{margin-bottom:6px}
.real{border-left:4px solid var(--accent);padding:4px 0 4px 12px;margin:0 0 16px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.tabs .cnt{position:absolute;top:4px;right:calc(50% - 40px);min-width:20px;height:20px;padding:0 4px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;font-style:normal}
.voice.new{border-left:4px solid var(--danger);padding-left:10px}
.newtag{border-color:var(--danger);color:var(--danger)}
.toast{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:15;max-width:520px;margin:0 auto;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px 12px;cursor:pointer;width:auto;transition:transform .3s steps(4),opacity .3s steps(4)}
.toast[hidden]{display:none}
.toast.out{transform:translateY(-140%);opacity:0}
.toast .tt{display:block;font-size:12px;color:var(--danger)}
.toast .tb{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
input[type="text"]{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:4px 8px;min-height:44px}
input[type="text"]:disabled{opacity:.6}
.domrow{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.domrow input{flex:1 1 140px;min-width:0}
.res{padding:0 12px 12px;margin:0}
.msg-err{color:var(--danger)}
.msg-ok{color:var(--safe)}
.title-screen{position:fixed;inset:0;z-index:30;background:var(--win-bg);color:var(--win-ink);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}

.tsub{opacity:.75;margin:0 0 18px}
.menu{border:4px solid var(--win-line);outline:4px solid var(--win-bg);padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.menu button{font:inherit;font-size:18px;line-height:1.5;color:var(--win-ink);background:none;border:0;text-align:left;padding:8px 10px 8px 34px;position:relative;cursor:pointer;min-height:44px}
.menu button::before{content:"▶";position:absolute;left:10px;top:8px;opacity:0}
.menu button:hover::before,.menu button:focus::before{opacity:1}
.menu button:focus{outline:none}
.menu button:focus-visible{outline:2px dashed var(--win-ink);outline-offset:-2px}
.sinfo{display:block;font-size:13px;opacity:.7}
.tq{margin:4px 10px 8px}
.tver{opacity:.5;font-size:12px;margin-top:20px}
.site{text-align:center;padding:40px 14px}
/* 管理タブ：1段目＝会社、2段目＝ピクセルクラウド内の小メニュー */
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin:12px 0 0}
.svc{font:inherit;text-align:left;background:var(--surface);color:var(--muted);border:3px solid var(--line);border-bottom:0;padding:6px 10px;cursor:pointer;min-height:48px;line-height:1.3;display:flex;gap:8px;align-items:center}
.svc small{display:block;font-size:11px}
.svc .spr{opacity:.6}
.svc[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 6px 0 var(--svc)}
.svc[aria-selected="true"] .spr{opacity:1}
.svc-registrar{--svc:var(--gold)}
.svc-cloud{--svc:var(--accent)}
.svc-ca{--svc:var(--safe)}
.svcframe{border:3px solid var(--line);border-top:8px solid var(--svc);background:var(--bg);padding:0 10px 2px;margin-bottom:14px}
.svchead{padding:10px 2px 0;font-size:18px;line-height:1.4;display:flex;gap:10px;align-items:center}
.svchead small{display:block;font-size:12px;color:var(--muted)}
.subs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 4px;border-bottom:2px dashed var(--soft);margin-bottom:4px}
.sub{font:inherit;font-size:13px;line-height:1.3;background:var(--surface);color:var(--muted);border:2px solid var(--line);padding:4px 10px;min-height:36px;cursor:pointer}
.sub[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.capanel{margin:10px 12px;padding:12px;border:3px dashed var(--line);background:var(--bg)}
.capanel p{margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv b{font-weight:400;overflow-wrap:anywhere}
.drow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1.4fr) 40px;gap:8px;padding:8px 12px;border-bottom:2px dashed var(--soft);font-size:14px;overflow-wrap:anywhere;align-items:center}
.dhead{font-size:12px;color:var(--muted)}
.url{display:flex;justify-content:center;align-items:center;gap:10px;font-size:clamp(20px,6vw,30px);line-height:1.3;overflow-wrap:anywhere}
.state{margin:12px 0 0;color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.more{animation:none}.toast{transition:none}}
.codeanim{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px;animation:caFade .18s ease}
.codeanim.done{animation:caFade .22s ease reverse;opacity:0}
.ca-win{width:min(540px,100%);background:#0b0d16;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ca-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:#14161f;border-bottom:1px solid var(--soft)}
.ca-dot{width:11px;height:11px;border-radius:50%}
.ca-dot.r{background:#ff5f57}.ca-dot.y{background:#febc2e}.ca-dot.g{background:#28c840}
.ca-file{color:var(--muted);font-size:12px;margin-left:7px}
.ca-tag{margin-left:auto;color:var(--gold);font-size:12px}
.ca-tag.ok{color:var(--safe)}
.ca-code{padding:15px 13px;font-size:13px;line-height:1.75;overflow-x:auto}
.ca-row{display:flex;gap:13px;white-space:pre}
.ca-ln{color:#4a4f70;user-select:none;min-width:14px;text-align:right}
.ca-tx{color:var(--ink)}
.ca-row.chg .ca-tx{color:#ff9aa6}
.ca-row.active{background:rgba(242,193,78,.08)}
.ca-tx.del{color:var(--danger);text-decoration:line-through}
.ca-tx.cur::after{content:'▋';color:var(--gold);animation:caBlink .6s step-end infinite}
.ca-tx.added{color:var(--safe)}
.ca-row.ok .ca-ln{color:var(--safe)}
@keyframes caFade{from{opacity:0}to{opacity:1}}
@keyframes caBlink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.codeanim{animation:none}}
.monitor{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.mon-h{font-size:12px;color:var(--muted);margin-bottom:8px}
.signup-form{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.signup-form input{background:var(--bg);border:1px solid var(--soft);border-radius:6px;padding:7px 9px;color:var(--ink);font:inherit}
.captcha{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--muted);font-size:13px}
.brute-count{font-size:14px;margin:8px 0}
.meter{height:16px;background:var(--bg);border:1px solid var(--soft);border-radius:8px;overflow:hidden}
.meter-bar{height:100%;transition:width .5s steps(8)}
.mon-res{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.mon-res b{font-size:14px}
.mon-res span{color:var(--muted)}
.mon-res.ok{border:1px solid var(--safe)}
.mon-res.bad{border:1px solid var(--danger)}
@media (prefers-reduced-motion:reduce){.meter-bar{transition:none}}
.certwarn{border:1px solid var(--danger);border-radius:8px;padding:11px;background:rgba(255,109,122,.06)}
.certwarn-h{color:var(--danger);font-weight:600;font-size:14px}
.certok{display:flex;align-items:center;gap:10px}
.vulnlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;border:1px solid var(--soft)}
.vrow b{font-size:13px}
.vrow span{font-size:12px;color:var(--muted)}
.vrow.bad{border-color:var(--danger)}
.vrow.ok{border-color:var(--safe)}
</style>
</head>
<body>
<header class="top">
  <span id="shopIcon"></span>
  <div><div class="chap" id="chapLabel"></div><div class="dayl" id="dayLabel"></div></div>
</header>

<main>
  <section id="p-shop" class="panel" role="tabpanel"></section>
  <section id="p-voice" class="panel" role="tabpanel" hidden></section>
  <section id="p-net" class="panel" role="tabpanel" hidden></section>
  <section id="p-console" class="panel" role="tabpanel" hidden></section>
</main>

<button id="win" class="win" hidden><span class="wface" id="winFace"></span><span><span class="who" id="winWho"></span><span id="winText"></span></span><span class="more" aria-hidden="true">▼</span></button>

<button id="toast" class="toast out" hidden aria-live="polite"><span id="toastIcon"></span><span><span class="tt" id="toastTitle"></span><span class="tb" id="toastText"></span></span></button>

<nav class="tabs" role="tablist" aria-label="画面の切り替え">
  <button role="tab" data-tab="shop">サイト</button>
  <button role="tab" data-tab="voice">お客さんの声</button>
  <button role="tab" data-tab="net">通信</button>
  <button role="tab" data-tab="console">管理</button>
</nav>

<div id="title" class="title-screen" hidden></div>

<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="sheet"></div></div>

<script src="sprites.js"></script>
<script src="days.js"></script>
<script src="days-ch2.js"></script>
<script src="days-ch3.js"></script>
<script src="days-ch4.js"></script>
<script>
(function(){
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- ピクセルスプライト（sprites.js） ---------- */
const SPR=window.GSI_SPRITES,PAL=SPR.palette,CAST=SPR.cast,IC=SPR.icons;
function rects(rows){let r='';rows.forEach((row,y)=>{[...row].forEach((ch,x)=>{if(ch!=='.'&&PAL[ch])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[ch]}"/>`;});});return r;}
function spr(rows,px,label){const w=rows[0].length,h=rows.length;return `<svg class="spr" viewBox="0 0 ${w} ${h}" width="${w*px}" height="${h*px}" shape-rendering="crispEdges" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${rects(rows)}</svg>`;}
function sprG(rows,x,y,px,id){return `<g ${id?`id="${id}"`:''} transform="translate(${x},${y}) scale(${px})" shape-rendering="crispEdges">${rects(rows)}</g>`;}
/* 待機2コマ目：体を1ドット下げる（名鑑と同じ） */
function frameRows(rows,f){return f?['.'.repeat(16)].concat(rows.slice(0,13),rows.slice(14,16)):rows;}
const castSpr=(id,px,label)=>spr(CAST[id].rows,px,label===undefined?CAST[id].name:label);
const CUST_ID={'たなか':'tanaka','すずき':'suzuki','やまだ':'yamada','法人のお客さま':'houjin'};
function voiceIcon(v){if(v.sys)return spr(IC.srv,4,'監視');if(v.who===SHIRO)return castSpr('shiro',3,'シロ');if(v.who===YOU)return castSpr('tencho',3,'店長');if(v.mail)return spr(IC.mail,4,'メール');return castSpr(CUST_ID[v.who]||'tomo',3,v.who);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- ステージ定義（days.js） ---------- */
const GD=window.GSI_DAYS,SHIRO=GD.SHIRO,YOU=GD.YOU,DAYS=GD.days,CAS=GD.cas,LAST_DAY=GD.lastDay;
const chapterOf=d=>(GD.chapters.find(c=>d>=c.from&&d<=c.to)||GD.chapters[0]).n;

/* ---------- 状態 ---------- */
const KEY='gsi-demo-v2';
const SERVER_IP='203.0.113.24';
const TAKEN=['shop','pixel','store','zakka','retro','example','google','amazon','rakuten','yahoo'];
const TLDS={'.com':'¥1,480／年','.jp':'¥3,980／年','.shop':'¥980／年'};
const fresh=()=>({day:0,phase:'intro',tab:'shop',voices:[],badge:{},cart:0,last:null,shopQ:'',shopRes:null,seenLeak:false,orderPrice:null,orderQty:null,buyQty:1,orderRes:null,seenTamper:false,reviewRes:null,seenXss:false,storeRes:null,seenStore:false,csrfRes:null,seenCsrf:false,idorRes:null,idorId:null,seenIdor:false,couponRes:null,seenCoupon:false,sessionRes:null,seenSession:false,botRes:null,seenBot:false,bruteN:0,bruteRes:null,seenBrute:false,dosRes:null,seenDos:false,wafRes:null,wafEnc:false,seenWaf:false,vulnShown:false,seenVuln:false,skimRes:null,seenSkim:false,keyRes:null,seenKey:false,domRes:null,seenDom:false,exfilRes:null,seenExfil:false,domain:null,ds:null,whois:false,dnsOk:false,dnsVal:'',dnsMsg:'',
  dns:[],svc:'registrar',sub:'server',relMsg:'',dcvMsg:'',instMsg:'',dnsAddMsg:'',
  cfg:{ca:null,keyMade:false,token:null,issued:false,installed:null,autoRenew:false,cert:false,https:false,redirect:false,tlsMin:'1.0',ciph:{aes:true,chacha:true,des3:true,rc4:true},hsts:false,hstsAge:'300',code:{},app:{},tasks:{}}});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.cfg)S=Object.assign(fresh(),s);}catch(e){}
delete S.trust;delete S.victims;
if(!S.sub)S.sub='server';
if(!S.cfg.code)S.cfg.code={};if(!S.cfg.app)S.cfg.app={};if(!S.cfg.tasks)S.cfg.tasks={};
if(S.dnsOk&&(!S.dns||!S.dns.length))S.dns=[{type:'A',name:'@',value:SERVER_IP}];
if(S.cfg.cert&&!S.cfg.installed)Object.assign(S.cfg,{ca:'free',keyMade:true,token:'DONE-DONE',issued:true,installed:'fullchain'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let busy=false,certBusy=false,dnsBusy=false;
const dm=s=>String(s).replace(/pixeldo\.example/g,S.domain||'pixeldo.example');
const $=id=>document.getElementById(id);

/* ---------- メッセージウィンドウ ---------- */
const win=$('win'),winWho=$('winWho'),winText=$('winText'),winFace=$('winFace');
let Q=[],showing=false,typing=null,full='';
function say(list,done){Q.push(...list);if(done)Q.push({fn:done});if(!showing)nextMsg();}
function nextMsg(){
  const m=Q.shift();
  if(!m){showing=false;win.hidden=true;document.body.classList.remove('talking');return;}
  if(m.fn){showing=true;m.fn();nextMsg();return;}
  showing=true;win.hidden=false;document.body.classList.add('talking');
  winWho.textContent=m.who||'';full=m.t;
  winFace.innerHTML=m.who===SHIRO?castSpr('shiro',3,''):m.who===YOU?castSpr('tencho',3,''):'';
  if(RM){winText.textContent=full;return;}
  let i=0;winText.textContent='';clearInterval(typing);
  typing=setInterval(()=>{i++;winText.textContent=full.slice(0,i);if(i>=full.length){clearInterval(typing);typing=null;}},28);
}
win.addEventListener('click',()=>{if(typing){clearInterval(typing);typing=null;winText.textContent=full;}else nextMsg();});

/* ---------- 描画 ---------- */
function render(){
  const fid=document.activeElement&&document.activeElement.id;
  renderHeader();renderTabs();renderShop();renderVoices();if(!busy)renderNet();renderConsole();
  if(fid&&$(fid)&&$(fid)!==document.activeElement)$(fid).focus();
}
function renderHeader(){
  $('shopIcon').innerHTML=spr(IC.shop,2.5);
  $('chapLabel').textContent=chapterOf(S.day);
  $('dayLabel').textContent=S.day===0?((S.phase==='intro'||S.phase==='setup')?'0日目　オープン準備':'0日目　オープン'):DAYS[S.day].title;
}
function renderTabs(){
  document.querySelectorAll('.tabs button').forEach(b=>{
    const t=b.dataset.tab,sel=t===S.tab;
    b.setAttribute('aria-selected',sel);
    b.querySelectorAll('.dot,.cnt').forEach(x=>x.remove());
    if(t==='voice'){const n=S.voices.filter(v=>v.unread).length;if(n&&!sel){const d=document.createElement('i');d.className='cnt';d.textContent=n;d.setAttribute('aria-label','新着'+n+'件');b.appendChild(d);}}
    else if(S.badge[t]&&!sel){const d=document.createElement('i');d.className='dot';d.setAttribute('aria-label','新着');b.appendChild(d);}
  });
  ['shop','voice','net','console'].forEach(t=>{$('p-'+t).hidden=t!==S.tab;});
}
const CATALOG=[
  {icon:'item_robot',name:'ブリキのロボット',price:'¥1,800'},
  {icon:'item_mug',name:'レトロなマグカップ',price:'¥980'},
  {icon:'item_sign',name:'ホーローの看板',price:'¥3,200'},
  {icon:'item_bottle',name:'すりガラスのびん',price:'¥600'},
  {icon:'item_cat',name:'まねき猫の貯金箱',price:'¥1,200'}
];
function renderShop(){
  const live=S.domain&&S.dnsOk&&S.phase!=='setup'&&S.phase!=='intro';
  let h=`<h2>サイト</h2><p class="muted small">お客さんから見える、お店のサイトです</p>`;
  if(S.phase==='setup')h+=`<div class="box"><p>お店はまだきみのパソコンの中にあるだけ。「管理」タブでドメインを取得して、リリースしよう。</p><button class="btn primary" data-act="goConsole">管理タブを開く</button></div>`;
  else if(!live)h+=`<div class="box"><p class="muted">まだ公開されていません。</p></div>`;
  else h+=browserHTML();
  h+=tasksHTML();
  h+=`<p style="margin-top:18px"><button class="link" data-act="toTitle">タイトルへ戻る</button></p>`;
  $('p-shop').innerHTML=h;
}
function xssNav(day){
  if(S.day!==day||!S.reviewRes||!S.reviewRes.xss)return;
  S.reviewRes.redir='loading';save();render();
  setTimeout(()=>{if(S.day===day&&S.reviewRes&&S.reviewRes.xss){S.reviewRes.redir='done';save();render();}},650);
}
function hijackHTML(nav){
  const url='http://当選プレゼント.example/login';
  const chrome=`<div class="chrome danger"><span class="dots"><i></i><i></i><i></i></span>
      <span class="urlbar danger"><span class="tri">!</span><span class="u">${url}</span></span>
      <span class="reload">${spr(IC.reload,2.5,'再読み込み')}</span></div>`;
  if(nav==='loading'){
    return `<div class="hj-meta"><span class="hj-meta-h">解説</span><p>レビューを開いた瞬間、ブラウザが <b>pixeldo.shop から別のサイトへ勝手に移動</b>しはじめました。</p></div>
      <div class="browser evil">${chrome}<div class="viewport"><div class="hj-load">当選プレゼント.example を開いています…</div></div></div>`;
  }
  // 枠の中（偽ブラウザ）＝お客さんの画面で実際に起きていること。枠の外のカード＝解説。
  return `<div class="hj-meta"><span class="hj-meta-h">解説：いま起きていること</span><p>レビューを開いただけで、ブラウザが <b>pixeldo.shop から下の別サイトへ勝手に移動</b>しました。お店とは無関係の、攻撃者が用意したページです（ログイン画面もニセモノ。入力はできないようにしてあります）。</p></div>
    <div class="browser evil">${chrome}
      <div class="viewport">
        <div class="evil-head"><span class="evil-logo">◆</span><span>特別当選センター</span></div>
        <div class="phish">
          <div class="phish-h">【重要】ログインの有効期限が切れました</div>
          <p class="small" style="margin:4px 0 0">続けるには、もう一度メールアドレスとパスワードを入力してください。</p>
          <label class="phish-f"><span>メールアドレス</span><input type="text" disabled placeholder="you@example.com"></label>
          <label class="phish-f"><span>パスワード</span><input type="password" disabled placeholder="••••••••"></label>
          <button class="btn primary" disabled>ログイン</button>
        </div>
      </div></div>
    <div class="hj-meta danger"><span class="hj-meta-h">解説：画面には出ないけど、同時に起きたこと</span><p>この瞬間、お客さんのログイン状態が攻撃者の手元へ送られました。</p><code class="hj-steal-c">cookie: SESSION=pixeldo_8f3ad92c17b4e6…</code><p style="margin:6px 0 0">これがあれば、パスワードを知らなくても、そのお客さんとしてログインできてしまいます。</p></div>
    <div class="hj-back"><button class="btn" data-act="xssBack">お店のサイト（pixeldo.shop）に戻る</button></div>`;
}
function browserHTML(){
  const d=DAYS[S.day],demo=d&&d.demo;
  if(demo&&demo.kind==='review'&&S.cfg.code.review!=='escape'&&S.reviewRes&&S.reviewRes.xss&&S.reviewRes.redir)return hijackHTML(S.reviewRes.redir);
  if(demo&&demo.kind==='csrf'&&S.csrfRes&&S.csrfRes.open)return csrfBrowserHTML();
  if(demo&&demo.kind==='idor'&&S.idorRes&&S.idorRes.open)return idorBrowserHTML();
  const sec=S.cfg.https&&S.cfg.redirect;
  const url=(sec?'https://':'http://')+esc(S.domain);
  let h=`<div class="browser">
    <div class="chrome"><span class="dots"><i></i><i></i><i></i></span>
      <span class="urlbar">${sec?spr(IC.lock,2.5,'保護された通信'):'<span class="warn small">保護なし</span>'}<span class="u">${url}</span></span>
      <span class="reload" data-act="doSearch" role="button" aria-label="再読み込み">${spr(IC.reload,2.5,'再読み込み')}</span></div>
    <div class="viewport">
      <div class="store-head">${spr(IC.shop,2.5,'よろず屋ピクセル堂')}<span class="sh-name"><span class="nm">よろず屋ピクセル堂</span><span class="tag">レトロ雑貨のネットショップ</span></span><span class="cart">カート ${S.cart||0}</span></div>
      <div class="hero"><span class="hero-t">レトロ雑貨、あつめました。</span><span class="hero-s">昭和のブリキからホーロー看板まで。</span></div>
      <div class="store-search"><input type="text" id="shopQ" placeholder="商品名で検索" value="${esc(S.shopQ||'')}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" data-act="doSearch">検索</button></div>`;
  if(demo&&demo.payload&&!demo.kind&&(S.cfg.code.search!=='param')){
    h+=`<div class="capanel" style="margin:0 12px 10px"><p class="small" style="margin:0 0 6px">${esc(demo.hint)}</p>
      <p class="small" style="margin:0">上の検索窓に <code class="optc">${esc(demo.payload)}</code> と入力して、「検索」を押してみよう。</p></div>`;
  }
  h+=`<div class="store-body">${searchResultHTML()}</div>`;
  if(demo&&demo.kind==='order')h+=orderDemoHTML();
  if(demo&&demo.kind==='review')h+=reviewDemoHTML();
  if(demo&&demo.kind==='store')h+=storeDemoHTML();
  if(demo&&demo.kind==='coupon')h+=couponDemoHTML();
  if(demo&&demo.kind==='csrf')h+=csrfIntroHTML();
  if(demo&&demo.kind==='idor')h+=idorIntroHTML();
  if(demo&&demo.kind==='session')h+=sessionDemoHTML();
  if(demo&&demo.kind==='signup')h+=signupDemoHTML();
  if(demo&&demo.kind==='login')h+=loginDemoHTML();
  if(demo&&demo.kind==='dos')h+=dosDemoHTML();
  if(demo&&demo.kind==='waf')h+=wafDemoHTML();
  if(demo&&demo.kind==='cert')h+=certDemoHTML();
  if(demo&&demo.kind==='vuln')h+=vulnDemoHTML();

function playCodeAnim(key,done){
  const s=SNIP[key];
  if(!s){done();return;}
  const ov=document.createElement('div');ov.className='codeanim';ov.id='codeanim';
  const rows=s.lines.map((ln,i)=>{const chg=ln[0]!==ln[1];return '<div class="ca-row'+(chg?' chg':'')+'" data-i="'+i+'"><span class="ca-ln">'+(i+1)+'</span><span class="ca-tx">'+esc(ln[0])+'</span></div>';}).join('');
  ov.innerHTML='<div class="ca-win"><div class="ca-bar"><span class="ca-dot r"></span><span class="ca-dot y"></span><span class="ca-dot g"></span><span class="ca-file">'+esc(s.file)+'</span><span class="ca-tag">対策を書き込み中…</span></div><div class="ca-code">'+rows+'</div></div>';
  document.body.appendChild(ov);
  const changed=s.lines.map((ln,i)=>({i,from:ln[0],to:ln[1]})).filter(x=>x.from!==x.to);
  const finish=()=>{const tag=ov.querySelector('.ca-tag');if(tag){tag.textContent='対策を適用しました';tag.className='ca-tag ok';}setTimeout(()=>{ov.classList.add('done');setTimeout(()=>{ov.remove();done();},240);},460);};
  let ci=0;
  (function nextLine(){
    if(ci>=changed.length){finish();return;}
    const c=changed[ci++];
    const row=ov.querySelector('.ca-row[data-i="'+c.i+'"]');
    const tx=row.querySelector('.ca-tx');
    row.classList.add('active');tx.className='ca-tx del';
    let txt=c.from;
    function erase(){
      if(txt.length>0){txt=txt.slice(0,-1);tx.textContent=txt;setTimeout(erase,8);return;}
      tx.className='ca-tx cur';let j=0;
      (function type(){
        if(j<=c.to.length){tx.textContent=c.to.slice(0,j);j++;setTimeout(type,16);return;}
        tx.className='ca-tx added';row.classList.remove('active');row.classList.add('ok');setTimeout(nextLine,120);
      })();
    }
    setTimeout(erase,240);
  })();
}

function computeOrder(src){
  const o=DAYS[S.day].demo,real=o.product.price;
  let price,qty;
  if(src==='buy'){price=real;qty=Number(S.buyQty==null?1:S.buyQty);}
  else{price=Number(S.orderPrice==null?real:S.orderPrice);qty=Number(S.orderQty==null?1:S.orderQty);}
  if(!isFinite(price))price=real;if(!isFinite(qty))qty=1;
  if(S.cfg.code.price==='server'){const q=Math.max(1,Math.min(99,Math.floor(qty)||1));return {safe:src!=='buy',normal:src==='buy',total:real*q,qty:q,real};}

  return {tampered,total,qty,price,real};

/* ---------- 攻撃の再生 ---------- */
function animatePacket(line,r,cb){
  const g=$('pkt');
  if(!g||RM){setTimeout(cb,RM?150:0);return;}
  const bad=line.k==='bad';
  const col=line.k==='ok'?'var(--safe)':bad?'var(--danger)':'var(--accent)';
  g.querySelector('rect').setAttribute('fill',col);
  $('pktL').textContent=line.k==='ok'?'#%&@!?':bad?(r.pkt||''):'';
  g.setAttribute('opacity','1');
  const tap=$('tap'),t0=performance.now(),dur=1600;let fired=false;
  function step(t){
    const p=Math.min(1,(t-t0)/dur),x=62+p*226;
    g.setAttribute('transform',`translate(${x},62)`);
    const near=NET.tx>=290?(x>=278):Math.abs(x+8-NET.tx)<16;
    if(tap)tap.setAttribute('stroke-width',near?'4':'2');
    if(near&&!fired){fired=true;bad?exfil():defendPulse();}
    if(p<1)requestAnimationFrame(step);else{g.setAttribute('opacity','0');if(tap)tap.setAttribute('stroke-width','2');cb();}
  }
  requestAnimationFrame(step);
}
// 盗まれたデータが点線を伝って攻撃者へ吸い込まれる演出
function exfil(){
  const steal=$('steal');if(!steal)return;
  const x0=NET.tx-6,y0=NET.ty+12,x1=NET.cx-6,y1=NET.ay+6;
  const t0=performance.now(),dur=600;
  (function st(t){const p=Math.min(1,(t-t0)/dur);
    steal.setAttribute('transform',`translate(${(x0+(x1-x0)*p).toFixed(1)},${(y0+(y1-y0)*p).toFixed(1)})`);
    steal.setAttribute('opacity',p<1?(0.4+0.6*(1-p)):'0');
    if(p<1)requestAnimationFrame(st);else{const a=$('atk');if(a){a.classList.add('atk-hit');setTimeout(()=>a.classList.remove('atk-hit'),450);}}
  })();
}
// 防げたとき：攻撃者が手を伸ばしても盾で弾かれる演出
function defendPulse(){
  const sh=$('shield');if(sh){sh.classList.add('atk-hit');setTimeout(()=>sh.classList.remove('atk-hit'),450);}
}
function runAttack(r,done){
  S.last={ok:r.ok,lines:[]};busy=true;renderNet();
  const log=$('log');log.innerHTML='';
  let i=0;
  (function go(){
    if(showing){setTimeout(go,150);return;}
    if(i>=r.lines.length){busy=false;save();render();done();return;}
    const src=r.lines[i++],line={k:src.k,t:dm(src.t)};
    animatePacket(line,r,()=>{S.last.lines.push(line);const div=document.createElement('div');div.className=line.k;div.textContent='› '+line.t;log.appendChild(div);setTimeout(go,RM?0:350);});
  })();
}

  else if(a==='csrfBack'){if(S.csrfRes)S.csrfRes.open=false;save();render();}
  else if(a==='idorOpen'){S.idorRes={open:true};S.idorId=DAYS[S.day].demo.myId;save();render();}
  else if(a==='idorBack'){if(S.idorRes)S.idorRes.open=false;save();render();}
  else if(a==='idorStep'){const o=DAYS[S.day].demo;S.idorId=Math.max(1000,Math.min(1004,(S.idorId||o.myId)+Number(b.dataset.d)));save();render();idorSeen();}
  else if(a==='idorSet'){S.idorId=Number(b.dataset.v);save();render();idorSeen();}
  else if(a==='sessShare'){S.sessionRes={shared:true};save();render();
    if(!(S.cfg.app&&S.cfg.app.store==='cookie')&&!S.seenSession){S.seenSession=true;save();say([{who:SHIRO,t:'ほら、URLを渡しただけで、その人があなたとしてログインできた'},{who:SHIRO,t:'合言葉がURLに入ってるのが原因。「管理」タブのアプリ設定でCookieに移そう'}]);}}
  else if(a==='couponFire'){const atomic=S.cfg.code.coupon==='atomic';S.couponRes=atomic?{safe:true}:{times:10};save();render();
    if(!atomic&&!S.seenCoupon){S.seenCoupon=true;save();say([{who:SHIRO,t:'ほら、1回限りのはずのクーポンが、連打で何回も効いちゃった'},{who:SHIRO,t:'確認と記録が別々だから隙間ができる。「管理」タブのピクセルハブで直そう'}]);}}
  else if(a==='ordSet'){if(b.dataset.p!=null)S.orderPrice=Number(b.dataset.p);if(b.dataset.q!=null)S.orderQty=Number(b.dataset.q);save();render();}
  else if(a==='ordBuy'){S.orderRes=computeOrder('buy');save();render();}
  else if(a==='ordSend'){S.orderRes=computeOrder('send');save();render();
    if(S.orderRes.tampered&&!S.seenTamper){S.seenTamper=true;save();say([{who:SHIRO,t:'ほら、画面では変えられない価格が、送信データを書き換えただけで通っちゃった'},{who:SHIRO,t:'お店が客の送ってきた金額を信じてるんだ。「管理」タブのピクセルハブで直そう'}]);}}
  else if(a==='botRun'){const fixed=S.cfg.code.signup==='verify';const list=[];for(let i=0;i<4;i++)list.push('user'+(1000+Math.floor(Math.random()*8999))+'@tempmail.example');S.botRes=fixed?{blocked:true,made:3,list:[]}:{blocked:false,made:100,list};save();render();if(!fixed&&!S.seenBot){S.seenBot=true;save();say([{who:SHIRO,t:'ほら、人間確認がないから、自動で何件でも作れちゃう'},{who:SHIRO,t:'管理タブのピクセルハブで、登録に人間確認とレート制限を入れよう'}]);}}
  else if(a==='bruteTry'){const fixed=S.cfg.code.login==='throttle';if(fixed){S.bruteN=5;S.bruteRes={locked:true,at:5};}else{S.bruteN=(S.bruteN||0)+100;S.bruteRes={locked:false};}save();render();if(!fixed&&!S.seenBrute){S.seenBrute=true;save();say([{who:SHIRO,t:'何回失敗しても止まらないから、試し放題だ'},{who:SHIRO,t:'ピクセルハブで、失敗が続いたらロックする仕組みを入れよう'}]);}}
  else if(a==='dosFire'){const fixed=S.cfg.code.dos==='shield';S.dosRes=fixed?{load:55,down:false}:{load:100,down:true};save();render();if(!fixed&&!S.seenDos){S.seenDos=true;save();say([{who:SHIRO,t:'ほら、一気に送られるとサーバーが落ちちゃう'},{who:SHIRO,t:'ピクセルハブで、前段で受け止めてレート制限する仕組みを入れよう'}]);}}
  else if(a==='wafEnc'){S.wafEnc=!S.wafEnc;S.wafRes=null;save();render();}
  else if(a==='wafSend'){const enc=!!S.wafEnc,layered=S.cfg.code.defense==='layered';S.wafRes={pass:enc};save();render();if(enc&&!layered&&!S.seenWaf){S.seenWaf=true;save();say([{who:SHIRO,t:'エンコードを変えただけで、WAFをすり抜けて届いた'},{who:SHIRO,t:'WAFは補助。ピクセルハブで、根本対策を重ねて多層防御にしよう'}]);}}
  else if(a==='vulnScan'){S.vulnShown=true;save();render();if(!S.seenVuln){S.seenVuln=true;save();say([{who:SHIRO,t:'ほら、使ってるソフトのバージョンが、そのまま公開済みの穴になってる'},{who:SHIRO,t:'ピクセルハブで更新しよう'}]);}}
  else if(a==='skimPay'){const locked=S.cfg.code.thirdparty==='lock';S.skimRes={stolen:!locked};save();render();if(!locked&&!S.seenSkim){S.seenSkim=true;save();say([{who:SHIRO,t:'差し替えられた外部スクリプトが、入力を外へ送っちゃった'},{who:SHIRO,t:'ピクセルハブで、SRIで固定しCSPで制限しよう'}]);}}
  else if(a==='keyView'){const safe=S.cfg.code.apikey==='server';S.keyRes={abused:!safe};save();render();if(!safe&&!S.seenKey){S.seenKey=true;save();say([{who:SHIRO,t:'ブラウザに届くコードに書いてあるキーは、誰でも読めて使える'},{who:SHIRO,t:'ピクセルハブで、キーをサーバー側に隠して失効・再発行しよう'}]);}}
  else if(a==='domTry'){const locked=S.cfg.code.registrar==='lock';S.domRes={hijacked:!locked};save();render();if(!locked&&!S.seenDom){S.seenDom=true;save();say([{who:SHIRO,t:'本人確認が甘いと、なりすましの移管が通ってしまう'},{who:SHIRO,t:'ピクセルハブで、移管ロックと2段階認証をかけよう'}]);}}
  else if(a==='exfilRun'){const guarded=S.cfg.code.egress==='monitor';S.exfilRes={leaked:!guarded};save();render();if(!guarded&&!S.seenExfil){S.seenExfil=true;save();say([{who:SHIRO,t:'外向きが自由だと、少量ずつこっそり持ち出せちゃう'},{who:SHIRO,t:'ピクセルハブで、出口を制限して異常を検知しよう'}]);}}
  else if(a==='applyFix'){const key=b.dataset.key,v=b.dataset.v;const go=()=>{c.code[key]=v;resetDemoRes();save();render();say([{who:SHIRO,t:'対策が入ったよ。「防げたか確かめる」で試してみよう'}]);};if(RM)go();else playCodeAnim(key,go);}
  else if(a==='undoFix'){delete c.code[b.dataset.key];resetDemoRes();save();render();}
  else if(a==='task'){const id=b.dataset.id,kind=b.dataset.kind;if(kind==='report')showModal(reportSheet(id));else showModal(noticeSheet(id));}
  else if(a==='taskDone'){S.cfg.tasks[b.dataset.id]=true;hideModal();save();
    const dd=DAYS[S.day];
    if(S.phase==='fix'&&dd&&dd.check(S.cfg).ok)verify();else render();}
});
document.addEventListener('change',e=>{
  const t=e.target,c=S.cfg;
  if(t.dataset.fix){c.code[t.dataset.fix]=t.dataset.v;}
  else if(t.dataset.task){c.tasks[t.dataset.task]=t.checked;}
  else if(t.dataset.app){c.app[t.dataset.app]=t.value;}
  else if('buyqty' in t.dataset){S.buyQty=Number(t.value);}
  else if(t.dataset.act==='tlsMin')c.tlsMin=t.value;
  else if(t.dataset.act==='hstsAge')c.hstsAge=t.value;
  else if(t.dataset.ci)c.ciph[t.dataset.ci]=t.checked;
  else if('whois' in t.dataset)S.whois=t.checked;
  else if(t.id==='nrType'){nr.type=t.value;return;}
  else if(t.id==='domTld')S.ds=Object.assign({},S.ds,{name:$('domName').value,tld:t.value,status:null});
  else return;
  save();render();
});

document.addEventListener('input',e=>{
  if(e.target.id==='nrName')nr.name=e.target.value;
  else if(e.target.id==='nrVal')nr.val=e.target.value;
  else if(e.target.id==='shopQ')S.shopQ=e.target.value;
  else if(e.target.id==='ordPrice')S.orderPrice=e.target.value===''?null:Number(e.target.value);
  else if(e.target.id==='ordQty')S.orderQty=e.target.value===''?null:Number(e.target.value);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='domName'){e.preventDefault();$('domSearch').click();}
  else if(e.target.id==='shopQ'){e.preventDefault();const el=$('shopQ');S.shopQ=el.value;S.shopRes=demoSearch(S.shopQ);save();render();sqliSeen();}
});

/* ---------- 再開 ---------- */
function resume(){
  if(S.phase==='intro')startIntro();
  else if(S.phase==='clear')showLearn();
  else if(S.phase==='end')showEnd();
  else if(S.phase==='day0')startDay(1);
  else if(S.phase==='setup')say([{who:SHIRO,t:'続きから再開するよ。「管理」タブでリリースの準備をしよう'}]);
  else if(S.phase==='incident'||S.phase==='fix')say([{who:SHIRO,t:'続きから再開するよ'}]);
}

/* ---------- タイトル画面 ---------- */
const title=$('title');
const TITLE_CAST=[['tencho',83,54],['shiro',122,58],['tanaka',6,58],['suzuki',150,60],['tochou',169,57,'lurk']];
let titleConfirm=false;
window.addEventListener('resize',()=>{if(!title.hidden)showTitle(titleConfirm);});
function hasSave(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return !!(s&&s.phase&&s.phase!=='intro');}catch(e){return false;}}
function showTitle(confirm){
  titleConfirm=confirm;
  Q=[];showing=false;clearInterval(typing);typing=null;win.hidden=true;document.body.classList.remove('talking');hideModal();hideToast();
  const sv=hasSave();
  const info=(S.phase==='end'?'第1章クリア':(S.day+'日目'))+(S.domain?'　'+esc(S.domain):'');
  let menu;
  if(confirm)menu=`<p class="tq">いまの記録は消えます。はじめからにしますか？</p><button role="menuitem" data-t="yes">はい</button><button role="menuitem" data-t="no">いいえ</button>`;
  else if(sv)menu=`<button role="menuitem" data-t="cont">つづきから<span class="sinfo">${info}</span></button><button role="menuitem" data-t="new">はじめから</button>`;
  else menu=`<button role="menuitem" data-t="new">はじめる</button>`;
  const sc=Math.max(1,Math.min(3,Math.floor((window.innerWidth-26)/180)));
  const chars=TITLE_CAST.map(([id,x,y,cls])=>`<span class="ch${cls?' '+cls:''}" data-cast="${id}" data-s="${sc}" style="left:${x*sc}px;top:${y*sc}px">${spr(frameRows(CAST[id].rows,tick),sc,'')}</span>`).join('');
  title.innerHTML=`<div class="tbox"><h1 class="tname"><small>よろず屋ピクセル堂を守れ</small>Getting<br>Secure It</h1>
    <div class="scene" style="width:${180*sc}px;height:${110*sc}px" aria-label="夜の商店街に立つよろず屋ピクセル堂" role="img"><img src="title.png" alt="" width="${180*sc}" height="${110*sc}">${chars}</div><p class="tsub">ネットショップを、1日ずつ守っていこう</p>
    <div class="menu" role="menu" aria-label="メニュー">${menu}</div><p class="tver">デモ版（第1章 通信編：0〜3日目）</p></div>`;
  title.hidden=false;
  const f=title.querySelector('button');if(f)f.focus();
}
title.addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
  if(t==='cont'){title.hidden=true;render();resume();}
  else if(t==='new'){if(hasSave())showTitle(true);else{title.hidden=true;reset();}}
  else if(t==='yes'){title.hidden=true;reset();}
  else if(t==='no')showTitle(false);
});
title.addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const bs=[...title.querySelectorAll('.menu button')],i=bs.indexOf(document.activeElement);
  if(!bs.length)return;e.preventDefault();
  bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();
});

/* ---------- 開始 ---------- */
render();
showTitle(false);
})();
</script>
</body>
