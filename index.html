<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Getting Secure It デモ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14161f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--surface:#14161f;--ink:#eef0ff;--muted:#a6abd4;--line:#8d93cc;--soft:#20233a;
  --gold:#f2c14e;--danger:#ff6d7a;--safe:#6fd38a;--accent:#97adff;--on-accent:#07080d;--mark:#ffe08a;--on-mark:#1a1426;
  --win-bg:#000000;--win-ink:#ffffff;--win-line:#ffffff;
  --net-bg:#0c0f1d;--net-hi:#ffffff;--dim:rgba(3,4,10,.5);
  --pc:#3a3f55;--pc-hi:#7a8099;--pc-sh:#26223a;--pc-lo:#1a1426;
  --br-strip:#171925;--br-bar:#272b3d;--br-field:#11131c;--br-ink:#e6e9ff;--br-mut:#9aa0c4;--br-line:#0b0c14;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#dfe6f1;--surface:#ffffff;--ink:#1d2042;--muted:#555b7e;--line:#1d2042;--soft:#cdd6e8;
  --gold:#a86e00;--danger:#c42f3c;--safe:#23793a;--accent:#3552c4;--on-accent:#ffffff;--mark:#ffc93c;
  --win-bg:#10123a;--win-ink:#ffffff;--win-line:#ffffff;
  --net-bg:#eef2fb;--net-hi:#3552c4;--dim:rgba(20,24,58,.34);
  --br-strip:#c5cddd;--br-bar:#eef1f8;--br-field:#ffffff;--br-ink:#1d2042;--br-mut:#5d6385;--br-line:#1d2042;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px}
.chap{font-size:12px;color:var(--muted);line-height:1.3}
.dayl{font-size:18px;line-height:1.4}
.logbtn{margin-left:auto;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:3px solid var(--line);padding:6px 10px;cursor:pointer;line-height:1.3;white-space:nowrap}
.logbtn:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.loghd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.logsec{font-size:12px;color:var(--muted);font-weight:bold;margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.logbody{max-height:60vh;overflow:auto}
.logln{margin:0 0 14px;line-height:1.7}
.logwho{display:block;font-size:12px;color:var(--muted);margin:0 0 2px}
.logtx{overflow-wrap:anywhere;white-space:pre-wrap}
.copyrow{display:flex;gap:8px;align-items:center;margin:6px 0 0;flex-wrap:wrap}
.copyrow code{flex:1;min-width:140px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--win-bg);color:#c9cff5;border:2px solid var(--line);padding:4px 8px;overflow-wrap:anywhere}
.copybtn{font:inherit;font-size:12px;color:var(--ink);background:var(--surface);border:2px solid var(--line);padding:5px 12px;cursor:pointer;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px 14px 110px}
body.talking main{padding-bottom:250px}
h2{font-size:20px;font-weight:400;margin:4px 0 4px}
h3{font-weight:400}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.box{background:var(--surface);border:3px solid var(--line);padding:14px;margin:12px 0 14px}
.btn{font:inherit;color:var(--ink);background:var(--surface);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:8px 14px;cursor:pointer;min-height:44px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{font:inherit;font-size:13px;line-height:1.3;background:none;border:0;color:var(--muted);padding:10px 4px;min-height:56px;position:relative;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
/* 目印の色（--mark：黄）は「ここを見て」の印だけに使う：案内の矢印・新着の印・会話ウィンドウの催促。赤と緑は「まずい／防げた」の意味、--accent は押せるもの */
.tabs .dot{position:absolute;top:7px;right:calc(50% - 32px);width:10px;height:10px;background:var(--mark);box-shadow:0 0 0 2px var(--on-mark)}
/* 会話ウィンドウ：話している間は暗幕（.dim）で背景を覆い、ほかの操作を止める。本文は選んでコピーできる */
.dim{position:fixed;inset:0;z-index:12;background:var(--dim)}
.dim[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.dim{animation:dimIn .16s ease-out}}
@keyframes dimIn{from{opacity:0}}
.win{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:13;-webkit-user-select:text;user-select:text;max-width:680px;margin:0 auto;text-align:left;font:inherit;font-size:16px;line-height:1.8;background:var(--win-bg);color:var(--win-ink);border:4px solid var(--win-line);outline:4px solid var(--win-bg);padding:10px 16px 24px;min-height:112px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:start;width:auto}
.win[hidden]{display:none}
.wface{display:block;width:48px;min-height:48px;padding-top:4px}
.wface:empty{width:0;min-height:0}
.who{display:block;font-size:13px;opacity:.75}
.wbody{min-width:0}
.win .copyrow{margin:8px 0 2px}
.more{position:absolute;right:14px;bottom:7px;line-height:0;animation:blink 1s steps(2) infinite}
.more svg{display:block}
.win.nudge{animation:winNudge .22s linear 2}
@keyframes winNudge{0%,49%{border-color:var(--mark)}50%,100%{border-color:var(--win-line)}}
@keyframes blink{50%{opacity:0}}
.addr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:3px solid var(--line);background:var(--surface);padding:6px 10px;font-size:14px;margin:8px 0 14px}
.warn{color:var(--danger)}
.secure{color:var(--safe)}
.spr{display:block;image-rendering:pixelated}
.voice{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:12px 0;border-bottom:2px dashed var(--soft)}
.voice:last-child{border-bottom:0}
.voice .vn{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border:2px solid var(--muted);padding:0 6px;margin-left:6px}
.warnT{color:var(--danger)}
/* ---------- 通信タブ：図（上）＋ログ（残りの高さ）。どの端末でも一画面に収める ---------- */
body[data-tab="net"] main,body[data-tab="net"].talking main{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
#p-net:not([hidden]){--net-h:calc(100vh - var(--top-h,60px) - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;height:var(--net-h)}
@supports (height:100dvh){#p-net:not([hidden]){--net-h:calc(100dvh - var(--top-h,60px) - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
body.talking #p-net:not([hidden]){height:calc(var(--net-h) - 164px)}
#p-net h2{margin:2px 0 2px;font-size:18px;flex:none}
#p-net>p.small{margin:0 0 6px;flex:none}
.netsvg{display:block;width:100%;height:auto;max-height:38vh;flex:none;background:var(--net-bg);border:3px solid var(--line)}
.netsvg text{font-family:inherit}
.nl{font-size:11px;fill:var(--ink)}
.nw{stroke:var(--line);stroke-width:2}
.ntube{fill:var(--safe);fill-opacity:.16;stroke:var(--safe);stroke-width:1.5}
.ntube.broken{fill:var(--danger);fill-opacity:.12;stroke:var(--danger);stroke-dasharray:4 3}
.np{font-size:10px}
.np.ok,.nok{fill:var(--safe)}
.np.bad,.broken .np.ok{fill:var(--danger)}
.nok{font-size:11px}
.nz{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.nzl{font-size:10px;fill:var(--muted);paint-order:stroke;stroke:var(--net-bg);stroke-width:7px;stroke-linejoin:round}
.ntb{fill:var(--surface);stroke:var(--line);stroke-width:2}
.nt.on .ntb{stroke:var(--net-hi);stroke-width:3}
.nt.hb .ntb{stroke:var(--danger);stroke-width:3}
.nt.hg .ntb{stroke:var(--safe);stroke-width:3}
.nt.atk .ntb{fill:#ff7a6b;stroke:#c2373f}
.nt.atk.hb .ntb{stroke:#fff}
.natk.def .nt.atk .ntb{fill:#7a8099;stroke:#3a3f55}
.nal{font-size:11px;fill:var(--danger)}
.natk.def .nal{fill:var(--muted)}
.nd{fill:var(--danger)}
.natk.def .nd{fill:var(--muted)}
.netsvg .off{display:none}
@keyframes nflow{0%{opacity:1}28%{opacity:.3}100%{opacity:.3}}
@keyframes nblink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes nin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .natk.flow:not(.def) .nd{animation:nflow 1.12s steps(1,end) infinite;animation-delay:calc(var(--i) * -0.14s)}
  .natk.in .nd{animation:nin .01s linear both;animation-delay:calc(var(--i) * 45ms)}
  .natk.in .nt.atk,.natk.in .nal{animation:nblink .3s steps(1,end) 1}
  .nsh.hit{animation:nblink .3s steps(1,end) 1}
}
.netlog{flex:1 1 0;min-height:76px;overflow-y:auto;margin:10px 0 0;padding:6px 10px 8px;background:var(--win-bg);color:#c9cff5;border:3px solid var(--line);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.netlog .lh{display:flex;align-items:center;gap:8px;font-size:11px;color:#9aa0cc;margin:0 0 3px}
.netlog .lh.atk{color:#ff8a94;margin:7px -10px 4px;padding:7px 10px 0;border-top:2px dashed #4a2a3c}
.netlog .af{display:block;line-height:0;background:#ff7a6b;border:2px solid #c2373f}
.netlog .ln{display:grid;grid-template-columns:44px 1fr;gap:0 8px;align-items:baseline;padding:1px 0}
.netlog .ln.b{grid-template-columns:10px 1fr;gap:0 6px}
.netlog .tg{font-size:10px;line-height:1.5;text-align:center;color:#9aa0cc;border:1px solid #565c88}
.netlog .tg.ok{color:#7ee59a;border-color:#3f8f58}
.netlog .tg.bad{color:#ff8a94;border-color:#a84a58}
.netlog .bad{color:#ff8a94}
.netlog .ok{color:#7ee59a}
.netlog code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#ffd9a8;border:1px solid #565c88;padding:0 4px;white-space:nowrap}
/* 「防げたか確かめる」：対策フェーズのあいだ、どのタブでも右下（タブの上）に固定。本文の右端にそろえる */
.fab{position:fixed;z-index:6;right:max(14px,calc(env(safe-area-inset-right,0px) + 14px),calc(50vw - 346px));bottom:calc(71px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 16px 6px 12px;font-size:15px;line-height:1.3;box-shadow:3px 3px 0 0 var(--line),0 0 0 3px var(--bg),3px 3px 0 3px var(--bg)}
.fab[hidden],body.talking .fab{display:none}
.fab .spr{flex:none}
body.fab-on:not(.talking):not([data-tab="net"]):not([data-tab="shop"]):not([data-tab="console"]) main{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
body.fab-on:not(.talking) #p-net:not([hidden]){height:calc(var(--net-h) - 64px)}
.sec{border:3px solid var(--line);background:var(--surface);margin:12px 0 14px}
.sec h3{margin:0;padding:8px 12px;background:var(--soft);font-size:16px;border-bottom:3px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-bottom:2px dashed var(--soft);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .desc{flex:1 1 180px}
.row .note{display:block;font-size:12px;color:var(--muted)}
.sw{font:inherit;min-width:72px;min-height:40px;border:3px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.sw[aria-pressed="true"]{background:var(--safe);color:var(--surface)}
.sw:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:4px 8px;min-height:44px}
select:disabled{opacity:.45}
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px dashed var(--soft);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk .note{font-size:12px;color:var(--muted);margin-left:auto}
.opt{display:grid;grid-template-columns:24px 1fr;gap:4px 10px;align-items:start;padding:10px 12px;border-bottom:2px dashed var(--soft);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.opt.on{background:var(--soft)}
.optl{grid-column:2;font-size:15px}
.optc{grid-column:2;display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--win-bg);color:#c9cff5;border:2px solid var(--line);padding:4px 8px;margin:2px 0;overflow-x:auto;white-space:pre;overflow-wrap:normal}
.optn{grid-column:2;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:10px 0}
.item{background:var(--surface);border:3px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item .iname{line-height:1.3}
.item .iprice{color:var(--gold)}
.btn.mini{font-size:12px;min-height:34px;padding:4px 8px;box-shadow:2px 2px 0 var(--line)}
.leak{border:3px solid var(--danger);background:var(--surface);padding:10px 12px;margin:10px 0}
.leakhd{color:var(--danger);font-size:14px;margin-bottom:8px}
.leakrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:2px dashed var(--soft);font-size:14px}
.leakrow:last-of-type{border-bottom:0}
.leakrow .lmail{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:13px}
/* ---------- サイトタブ：パソコンのディスプレイ。画面の中＝ゲームの世界で実際に見えているもの／画面の外＝シロの解説（メタ情報） ---------- */
body[data-tab="shop"] main,body[data-tab="console"] main{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
body[data-tab="shop"].talking main,body[data-tab="console"].talking main{padding-bottom:250px}
#p-shop:not([hidden]),#p-console:not([hidden]){--shop-h:calc(100vh - var(--top-h,60px) - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;min-height:var(--shop-h)}
@supports (height:100dvh){#p-shop:not([hidden]),#p-console:not([hidden]){--shop-h:calc(100dvh - var(--top-h,60px) - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
#p-shop>*,#p-console>*{flex:none}
.shop-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;margin:0 0 2px}
.shop-hd h2{margin:0;font-size:18px}
.shop-hd p{margin:0}
.shop-foot{margin:auto 0 0;display:flex;align-items:flex-end}
body.fab-on:not(.talking) .shop-foot{min-height:62px}
/* ディスプレイ本体：ふち・画面・あご（電源ランプ）・首・台 */
.pc{position:relative;display:flex;flex-direction:column;margin:8px 0 12px;min-width:0}
#p-shop>.pc.fill,#p-console>.pc.fill{flex:1 1 auto;min-height:min(calc(var(--shop-h) - 46px),max(360px,calc(var(--shop-h) * .58)))}
.pc-who{align-self:flex-start;margin-left:10px;padding:1px 8px;font-size:11px;line-height:1.5;color:var(--muted);background:var(--surface);border:2px solid var(--pc);border-bottom:0}
.pc-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--pc);border:3px solid var(--pc-lo);padding:8px 8px 0;box-shadow:inset 2px 2px 0 var(--pc-hi),inset -2px -2px 0 var(--pc-sh)}
.pc-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid var(--pc-lo);background:#000}
.pc-chin{flex:none;position:relative;height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;letter-spacing:.24em;color:var(--pc-hi)}
.pc-led{position:absolute;right:3px;top:6px;width:6px;height:6px;background:#6ccf7a;box-shadow:0 0 0 1px var(--pc-lo)}
.pc-neck{flex:none;align-self:center;width:56px;height:10px;background:var(--pc-sh);border:solid var(--pc-lo);border-width:0 3px}
.pc-foot{flex:none;align-self:center;width:min(170px,56%);height:10px;background:var(--pc);border:3px solid var(--pc-lo);box-shadow:inset 0 2px 0 var(--pc-hi)}
@media (max-width:359px){.pc-body{padding:6px 6px 0}}
/* ブラウザ：タブの列＋ツールバー（戻る・進む・再読み込み・アドレス欄・メニュー）＋ページ */
.browser{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--br-bar);color:var(--br-ink)}
.tabstrip{flex:none;display:flex;align-items:flex-end;gap:6px;min-height:31px;padding:5px 8px 0;background:var(--br-strip)}
.dots{display:flex;gap:5px;flex:none;align-self:center}
.dots i{display:block;width:9px;height:9px;border-radius:50%;background:#ff7a6b;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.dots i:nth-child(2){background:#e8b33a}
.dots i:nth-child(3){background:#6ccf7a}
.btab{flex:0 1 230px;min-width:0;display:flex;align-items:center;gap:6px;margin-left:4px;padding:4px 8px 5px;font-size:12px;line-height:1.35;background:var(--br-bar);color:var(--br-ink);border-radius:6px 6px 0 0}
/* 管理タブ：会社ごとにブラウザのタブを並べる。開いていないタブは狭くなり、アイコンだけになる */
button.btab{font:inherit;font-size:12px;border:0;cursor:pointer;text-align:left;position:relative;flex:1 1 0;min-width:34px;max-width:150px;min-height:34px;margin-left:0;container-type:inline-size}
button.btab[aria-selected="true"]{flex:0 1 auto;max-width:none;container-type:normal}
button.btab[aria-selected="false"]{background:transparent;color:var(--br-mut)}
button.btab[aria-selected="false"]:hover{background:var(--br-bar)}
button.btab[aria-selected="false"] .spr{opacity:.75}
@container (max-width:70px){.btitle{display:none}}
.tabstrip.multi{gap:3px}
@media (max-width:359px){.tabstrip.multi .dots,.tabstrip.multi .bplus{display:none}}
/* 案内の矢印：次に開くとよいタブ（や小メニュー）の上に立つ。ゲームの案内なので、画面のふちにはみ出して描く */
.guide{position:absolute;left:50%;top:-24px;margin-left:-10.5px;line-height:0;color:var(--mark);pointer-events:none;z-index:2;filter:drop-shadow(1px 0 0 var(--on-mark)) drop-shadow(-1px 0 0 var(--on-mark)) drop-shadow(0 1px 0 var(--on-mark)) drop-shadow(0 -1px 0 var(--on-mark))}
@media (prefers-reduced-motion:no-preference){.guide{animation:guide .8s steps(1,end) infinite}}
@keyframes guide{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bfav{flex:none;line-height:0}
.btitle{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bx,.bplus{flex:none;line-height:0;color:var(--br-mut)}

.tkick{margin:0 0 8px;font-size:clamp(12px,3.5vw,17px);letter-spacing:.3em;margin-right:-.3em;color:#c3c7d6;text-shadow:2px 2px 0 #1a1426}
.tname{font-weight:400;font-size:clamp(34px,11vw,60px);line-height:1.05;margin:0;color:#ffe08a;letter-spacing:.02em;text-shadow:2px 2px 0 #c2373f,4px 4px 0 #1a1426}
.tbox.two .tname{font-size:clamp(34px,min(6vw,11vh),72px)}
.scene{grid-area:scene;align-self:center;position:relative}
.scene img{display:block;width:100%;height:100%;image-rendering:pixelated}
.ch{position:absolute;display:block;line-height:0}
.ch.lurk{filter:brightness(.22)}
.tsub{opacity:.8;margin:0 0 12px;font-size:15px}
.menu{border:4px solid #fff;outline:4px solid #070916;background:rgba(7,9,22,.86);padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.menu button{font:inherit;font-size:18px;line-height:1.5;color:#fff;background:none;border:0;text-align:left;padding:8px 10px 8px 34px;position:relative;cursor:pointer;min-height:44px}
.menu button::before{content:"";position:absolute;left:12px;top:15px;width:8px;height:14px;background:currentColor;opacity:0;-webkit-mask:var(--cursor) center/contain no-repeat;mask:var(--cursor) center/contain no-repeat}
.menu button:hover::before,.menu button:focus::before{opacity:1}
.menu button:focus{outline:none}
.menu button:focus-visible{outline:2px dashed #fff;outline-offset:-2px}
.sinfo{display:block;font-size:13px;opacity:.7}
.tq{margin:4px 10px 8px}
.tver{opacity:.55;font-size:12px;margin:14px 0 0}
.site{text-align:center;padding:40px 14px}
/* ピクセルクラウドの中の小メニュー（サーバー／証明書／通信設定） */
.subs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 4px;border-bottom:2px dashed var(--soft);margin-bottom:4px}
.sub{font:inherit;font-size:13px;line-height:1.3;background:var(--surface);color:var(--muted);border:2px solid var(--line);padding:4px 10px;min-height:36px;cursor:pointer}
.sub[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.capanel{margin:10px 12px;padding:12px;border:3px dashed var(--line);background:var(--bg)}
.capanel p{margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv b{font-weight:400;overflow-wrap:anywhere}
.drow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1.4fr) 40px;gap:8px;padding:8px 12px;border-bottom:2px dashed var(--soft);font-size:14px;overflow-wrap:anywhere;align-items:center}
.dhead{font-size:12px;color:var(--muted)}
.url{display:flex;justify-content:center;align-items:center;gap:10px;font-size:clamp(20px,6vw,30px);line-height:1.3;overflow-wrap:anywhere}
.state{margin:12px 0 0;color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.more{animation:none}.toast{transition:none}}
.codeanim{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px;animation:caFade .18s ease}
.codeanim.done{animation:caFade .22s ease reverse;opacity:0}
.ca-win{width:min(540px,100%);background:#0b0d16;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ca-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:#14161f;border-bottom:1px solid var(--soft)}
.ca-dot{width:11px;height:11px;border-radius:50%}
.ca-dot.r{background:#ff5f57}.ca-dot.y{background:#febc2e}.ca-dot.g{background:#28c840}
.ca-file{color:var(--muted);font-size:12px;margin-left:7px}
.ca-tag{margin-left:auto;color:var(--gold);font-size:12px}
.ca-tag.ok{color:var(--safe)}
.ca-code{padding:15px 13px;font-size:13px;line-height:1.75;overflow-x:auto}
.ca-row{display:flex;gap:13px;white-space:pre}
.ca-ln{color:#4a4f70;user-select:none;min-width:14px;text-align:right}
.ca-tx{color:var(--ink)}
.ca-row.chg .ca-tx{color:#ff9aa6}
.ca-row.active{background:rgba(242,193,78,.08)}
.ca-tx.del{color:var(--danger);text-decoration:line-through}
.ca-tx.cur::after{content:'▋';color:var(--gold);animation:caBlink .6s step-end infinite}
.ca-tx.added{color:var(--safe)}
.ca-row.ok .ca-ln{color:var(--safe)}
@keyframes caFade{from{opacity:0}to{opacity:1}}
@keyframes caBlink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.codeanim{animation:none}}
.monitor{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.mon-h{font-size:12px;color:var(--muted);margin-bottom:8px}
.signup-form{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.signup-form input{background:var(--bg);border:1px solid var(--soft);border-radius:6px;padding:7px 9px;color:var(--ink);font:inherit}
.captcha{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--muted);font-size:13px}
.brute-count{font-size:14px;margin:8px 0}
.meter{height:16px;background:var(--bg);border:1px solid var(--soft);border-radius:8px;overflow:hidden}
.meter-bar{height:100%;transition:width .5s steps(8)}
.mon-res{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.mon-res b{font-size:14px}
.mon-res span{color:var(--muted)}
.mon-res.ok{border:1px solid var(--safe)}
.mon-res.bad{border:1px solid var(--danger)}
@media (prefers-reduced-motion:reduce){.meter-bar{transition:none}}
.vulnlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;border:1px solid var(--soft)}
.vrow b{font-size:13px}
.vrow span{font-size:12px;color:var(--muted)}
.vrow.bad{border-color:var(--danger)}
.vrow.ok{border-color:var(--safe)}
</style>
</head>
<body>
<header class="top">
  <span id="shopIcon"></span>
  <div><div class="chap" id="chapLabel"></div><div class="dayl" id="dayLabel"></div></div>
  <button id="logBtn" class="logbtn" data-act="log" aria-label="シロとの会話ログを開く">会話ログ</button>
</header>

<main>
  <section id="p-shop" class="panel" role="tabpanel"></section>
  <section id="p-voice" class="panel" role="tabpanel" hidden></section>
  <section id="p-net" class="panel" role="tabpanel" hidden></section>
  <section id="p-console" class="panel" role="tabpanel" hidden></section>
</main>

<div id="dim" class="dim" hidden></div>
<div id="win" class="win" role="dialog" aria-modal="true" aria-labelledby="winWho" aria-describedby="winText" tabindex="-1" hidden><div class="wface" id="winFace"></div><div class="wbody"><div class="who" id="winWho"></div><div id="winText"></div><div id="winCopy"></div></div><span class="more" aria-hidden="true"><svg viewBox="0 0 5 3" width="15" height="9" shape-rendering="crispEdges"><path d="M0 0h5v1h-1v1h-1v1h-1v-1h-1v-1h-1z" fill="currentColor"/></svg></span></div>

<button id="toast" class="toast out" hidden aria-live="polite"><span id="toastIcon"></span><span><span class="tt" id="toastTitle"></span><span class="tb" id="toastText"></span></span></button>

<nav class="tabs" role="tablist" aria-label="画面の切り替え">
  <button role="tab" data-tab="shop">サイト</button>
  <button role="tab" data-tab="voice">お知らせ</button>
  <button role="tab" data-tab="net">通信</button>
  <button role="tab" data-tab="console">管理</button>
</nav>

<button id="verifyBtn" class="btn primary fab" data-act="verify" hidden><span id="fabIcon" aria-hidden="true"></span><span id="fabLabel">防げたか確かめる</span></button>

<div id="title" class="title-screen" hidden></div>

<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="sheet"></div></div>

<script src="sprites.js"></script>
<script src="days.js"></script>
<script src="days-ch2.js"></script>
<script src="days-ch3.js"></script>
<script src="days-ch4.js"></script>
<script>
(function(){
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- ピクセルスプライト（sprites.js） ---------- */
const SPR=window.GSI_SPRITES,PAL=SPR.palette,CAST=SPR.cast,IC=SPR.icons;
function rects(rows){let r='';rows.forEach((row,y)=>{[...row].forEach((ch,x)=>{if(ch!=='.'&&PAL[ch])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[ch]}"/>`;});});return r;}
function spr(rows,px,label){const w=rows[0].length,h=rows.length;return `<svg class="spr" viewBox="0 0 ${w} ${h}" width="${w*px}" height="${h*px}" shape-rendering="crispEdges" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${rects(rows)}</svg>`;}
function sprG(rows,x,y,px,id){return `<g ${id?`id="${id}"`:''} transform="translate(${x},${y}) scale(${px})" shape-rendering="crispEdges">${rects(rows)}</g>`;}
/* 待機2コマ目：体を1ドット下げる（名鑑と同じ） */
function frameRows(rows,f){return f?['.'.repeat(16)].concat(rows.slice(0,13),rows.slice(14,16)):rows;}
const castSpr=(id,px,label)=>spr(CAST[id].rows,px,label===undefined?CAST[id].name:label);
const CUST_ID={'たなか':'tanaka','すずき':'suzuki','やまだ':'yamada','法人のお客さま':'houjin','友達':'tomo','セキュリティ研究者':'kenkyu'};
function voiceIcon(v){if(v.sys)return spr(IC.monitor,4,'監視');if(v.who===SHIRO)return castSpr('shiro',3,'シロ');if(v.who===YOU)return castSpr('tencho',3,'店長');const id=CUST_ID[v.who];if(id)return castSpr(id,3,v.who);if(v.mail)return spr(IC.mail,4,'メール');return castSpr('tomo',3,v.who);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- ステージ定義（days.js） ---------- */
const GD=window.GSI_DAYS,SHIRO=GD.SHIRO,YOU=GD.YOU,DAYS=GD.days,CAS=GD.cas,LAST_DAY=GD.lastDay;
const chapterOf=d=>(GD.chapters.find(c=>d>=c.from&&d<=c.to)||GD.chapters[0]).n;

/* ---------- 状態 ---------- */
const KEY='gsi-demo-v2';
const SERVER_IP='203.0.113.24';
const TAKEN=['shop','pixel','store','zakka','retro','example','google','amazon','rakuten','yahoo'];
const TLDS={'.com':'¥1,480／年','.jp':'¥3,980／年','.shop':'¥980／年'};
const fresh=()=>({day:0,phase:'intro',tab:'shop',voices:[],badge:{},cart:0,last:null,chatLog:[],shopQ:'',shopRes:null,seenLeak:false,orderPrice:null,orderQty:null,buyQty:1,orderRes:null,seenTamper:false,reviewQ:'',reviewRes:null,seenXss:false,storeRes:null,seenStore:false,csrfRes:null,seenCsrf:false,idorRes:null,idorId:null,seenIdor:false,couponRes:null,seenCoupon:false,sessionRes:null,seenSession:false,botRes:null,seenBot:false,bruteN:0,bruteRes:null,seenBrute:false,dosRes:null,seenDos:false,wafRes:null,wafEnc:false,seenWaf:false,vulnShown:false,seenVuln:false,skimRes:null,seenSkim:false,keyRes:null,seenKey:false,domRes:null,seenDom:false,exfilRes:null,seenExfil:false,domain:null,ds:null,whois:false,dnsOk:false,dnsVal:'',dnsMsg:'',
  dns:[],svc:'registrar',sub:'server',relMsg:'',dcvMsg:'',instMsg:'',dnsAddMsg:'',
  cfg:{ca:null,keyMade:false,token:null,issued:false,installed:null,autoRenew:false,cert:false,https:false,redirect:false,tlsMin:'1.0',ciph:{aes:true,chacha:true,des3:true,rc4:true},hsts:false,hstsAge:'300',code:{},app:{},tasks:{}}});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.cfg)S=Object.assign(fresh(),s);}catch(e){}
delete S.trust;delete S.victims;
if(S.cfg&&S.cfg.ca==='paid')S.cfg.ca='free';
if(!S.sub)S.sub='server';
if(!S.cfg.code)S.cfg.code={};if(!S.cfg.tasks)S.cfg.tasks={};
if(S.dnsOk&&(!S.dns||!S.dns.length))S.dns=[{type:'A',name:'@',value:SERVER_IP}];
if(S.cfg.cert&&!S.cfg.installed)Object.assign(S.cfg,{ca:'free',keyMade:true,token:'DONE-DONE',issued:true,installed:'fullchain'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let busy=false,certBusy=false,dnsBusy=false;
const dm=s=>String(s).replace(/pixeldo\.example/g,S.domain||'pixeldo.example');
const $=id=>document.getElementById(id);

/* ---------- メッセージウィンドウ ---------- */
const win=$('win'),winWho=$('winWho'),winText=$('winText'),winFace=$('winFace'),winCopy=$('winCopy'),dim=$('dim');
let Q=[],showing=false,typing=null,full='';
// セリフの「」の中にあるコード（' や < や = を含むもの）には、コピー欄を付ける（会話ウィンドウと会話ログで共通）
const CODE_RE=/[<']|--|=/;
function codeSnips(t){const out=[],re=/「([^」]*)」/g;let m;while((m=re.exec(t)))if(CODE_RE.test(m[1]))out.push(m[1]);return out;}
const copyRowHTML=c=>`<div class="copyrow"><code>${esc(c)}</code><button class="copybtn" data-act="copy" data-copy="${esc(c)}">コピー</button></div>`;
function showWinCopy(){winCopy.innerHTML=codeSnips(full).map(copyRowHTML).join('');}
// 話している間は、背景を暗くして操作できなくする（inert）。終わったら元の場所へフォーカスを戻す
const TALK_BG=['.top','main','.tabs','#toast','#verifyBtn'].map(q=>document.querySelector(q));
const FINE_PTR=!!(window.matchMedia&&matchMedia('(pointer:fine)').matches);
let talkFocus=null;
function setTalking(on){
  if(document.body.classList.contains('talking')===on)return;
  document.body.classList.toggle('talking',on);
  win.hidden=!on;dim.hidden=!on;
  TALK_BG.forEach(el=>{if(el)el.inert=on;});
  if(on){const a=document.activeElement;talkFocus=a&&a!==document.body&&a.id?a.id:null;win.focus({preventScroll:true});return;}
  win.classList.remove('nudge');
  const el=talkFocus&&$(talkFocus);talkFocus=null;
  // スマホでは入力欄にフォーカスを戻さない（キーボードが勝手に開くため）
  if(el&&!el.disabled&&el.offsetParent!==null&&(FINE_PTR||!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)))el.focus({preventScroll:true});
}
function say(list,done){Q.push(...list);if(done)Q.push({fn:done});if(!showing)nextMsg();}
function nextMsg(){
  const m=Q.shift();
  if(!m){showing=false;setTalking(false);return;}
  if(m.fn){showing=true;m.fn();nextMsg();return;}
  showing=true;setTalking(true);
  if(!S.chatLog)S.chatLog=[];S.chatLog.push({who:m.who||'',t:m.t});if(S.chatLog.length>400)S.chatLog.splice(0,S.chatLog.length-400);save();
  winWho.textContent=m.who||'';full=m.t;winCopy.innerHTML='';
  winFace.innerHTML=m.who===SHIRO?castSpr('shiro',3,''):m.who===YOU?castSpr('tencho',3,''):'';
  if(RM){winText.textContent=full;showWinCopy();return;}
  let i=0;winText.textContent='';clearInterval(typing);
  typing=setInterval(()=>{i++;winText.textContent=full.slice(0,i);if(i>=full.length){clearInterval(typing);typing=null;showWinCopy();}},28);
}
function advance(){if(typing){clearInterval(typing);typing=null;winText.textContent=full;showWinCopy();}else nextMsg();}
// タップで進む。ただし文字を選んだとき・選択を解除するタップ・コピー欄の操作では進めない
const winSel=()=>{const g=window.getSelection&&getSelection();return !!(g&&g.rangeCount&&!g.isCollapsed&&win.contains(g.getRangeAt(0).commonAncestorContainer));};
let selDown=false;
win.addEventListener('pointerdown',()=>{selDown=winSel();});
win.addEventListener('click',e=>{
  if(e.target.closest('.copyrow'))return;
  const sel=selDown||winSel();selDown=false;
  if(!sel)advance();
});
// Enter／スペースで進む（会話中ならフォーカスがどこにあっても。ウィンドウ内のコピーボタンはそのボタンの動きを優先）
document.addEventListener('keydown',e=>{
  if(win.hidden||!$('modal').hidden||!$('title').hidden)return;
  if(e.target!==win&&win.contains(e.target))return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}
});
// 暗い所をタップしたら、会話ウィンドウの枠を光らせて「こちらを押して進む」と知らせる
dim.addEventListener('click',()=>{win.classList.remove('nudge');void win.offsetWidth;win.classList.add('nudge');win.focus({preventScroll:true});});
win.addEventListener('animationend',e=>{if(e.animationName==='winNudge')win.classList.remove('nudge');});
/* 「防げたか確かめる」：対策フェーズのあいだ右下に出す。確かめている間は押せない */
const fab=$('verifyBtn');
$('fabIcon').innerHTML=spr(IC.shield,2,'');
function renderFab(){
  const d=DAYS[S.day],on=S.phase==='fix'&&!!(d&&d.check);
  fab.hidden=!on;document.body.classList.toggle('fab-on',on);
  fab.disabled=evPlaying;
  $('fabLabel').textContent=evPlaying?'確かめています…':'防げたか確かめる';
}

/* ---------- 描画 ---------- */
function render(){
  const fid=document.activeElement&&document.activeElement.id;
  renderHeader();renderTabs();renderShop();renderVoices();if(!busy)renderNet();renderConsole();renderFab();
  if(fid&&$(fid)&&$(fid)!==document.activeElement)$(fid).focus();
}
function renderHeader(){
  $('shopIcon').innerHTML=spr(IC.shop,2.5);
  $('chapLabel').textContent=chapterOf(S.day);
  $('dayLabel').textContent=S.day===0?((S.phase==='intro'||S.phase==='setup')?'0日目　オープン準備':'0日目　オープン'):DAYS[S.day].title;
}
function renderTabs(){
  document.querySelectorAll('.tabs button').forEach(b=>{
    const t=b.dataset.tab,sel=t===S.tab;
    b.setAttribute('aria-selected',sel);
    b.querySelectorAll('.dot,.cnt').forEach(x=>x.remove());
    if(t==='voice'){const n=S.voices.filter(v=>v.unread).length;if(n&&!sel){const d=document.createElement('i');d.className='cnt';d.textContent=n;d.setAttribute('aria-label','新着'+n+'件');b.appendChild(d);}}
    else if(S.badge[t]&&!sel){const d=document.createElement('i');d.className='dot';d.setAttribute('aria-label','新着');b.appendChild(d);}
  });
  ['shop','voice','net','console'].forEach(t=>{$('p-'+t).hidden=t!==S.tab;});
  document.body.dataset.tab=S.tab;
}
const CATALOG=[
  {icon:'item_robot',name:'ブリキのロボット',price:'¥1,800'},
  {icon:'item_mug',name:'レトロなマグカップ',price:'¥980'},
  {icon:'item_sign',name:'ホーローの看板',price:'¥3,200'},
  {icon:'item_bottle',name:'すりガラスのびん',price:'¥600'},
  {icon:'item_cat',name:'まねき猫の貯金箱',price:'¥1,200'}
];
/* ---------- サイトタブ：パソコンのディスプレイに映るブラウザ ----------
   画面の中（pcHTML の中身）＝ゲームの世界で実際に見えているもの。お店のページ・検証ツール・別サイトなど
   画面の外（note）＝シロのメモ。解説や「再現する」ボタンなど、ゲームの世界にはないもの */
// 単色の小さな記号（ブラウザのボタンなど）。'#' を文字色で塗る
const GLYPH={
  back:['...#...','..#....','.#.....','#######','.#.....','..#....','...#...'],
  fwd:['...#...','....#..','.....#.','#######','.....#.','....#..','...#...'],
  reload:IC.reload.map(r=>r.replace(/[^.]/g,'#')),
  x:['#...#','.#.#.','..#..','.#.#.','#...#'],
  plus:['..#..','..#..','#####','..#..','..#..'],
  more:['#','.','#','.','#'],
  diamond:['...#...','..###..','.#####.','#######','.#####.','..###..','...#...'],
  star:['...#...','...#...','#######','.#####.','..###..','.##.##.','.#...#.'],
  down:['..###..','..###..','..###..','#######','.#####.','..###..','...#...']
};
function mono(rows,px,label){const w=rows[0].length,h=rows.length;let r='';rows.forEach((row,y)=>{[...row].forEach((ch,x)=>{if(ch==='#')r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;});});return `<svg class="mono" viewBox="0 0 ${w} ${h}" width="${w*px}" height="${h*px}" fill="currentColor" shape-rendering="crispEdges" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${r}</svg>`;}
const DOM=()=>S.domain||'pixeldo.shop';
const yen=n=>'¥'+Number(n).toLocaleString();
// シロのメモ。kind：なし＝説明／danger＝まずいこと／ok＝防げたこと
const note=(label,body,kind)=>`<div class="hj-meta${kind?' '+kind:''}"><div class="note-hd">${castSpr('shiro',1.5,'')}<span class="hj-meta-h">${label}</span></div>${body}</div>`;
const notes=(...a)=>`<div class="notes">${a.join('')}</div>`;
// ディスプレイ。who＝だれのパソコンか（画面の外の札）。fill＝タブの残りの高さいっぱいに広げる
function pcHTML(inner,who,fill){

//   site:会社ごとの配色, tabs:[{id,title,fav,on,guide}]（タブを複数並べるとき。押すと data-act="svc" で切り替わる）}
function browserWin(o,page){
  const sec=o.sec==='ok'?spr(IC.lock,2,'保護された通信'):o.sec==='no'?`<span class="nosec">${spr(IC.lock_open,1.5,'')}保護なし</span>`:o.sec==='bad'?`<span class="nosec">${spr(IC.warn,2,'警告')}${o.evil?'':'保護なし'}</span>`:'';

    :`<span class="urlbar">${sec}<span class="u">${esc(o.url)}</span></span>`;
  const nb=(g,cls,act,label)=>act?`<button class="nav ${cls}" data-act="${act}" aria-label="${label}">${mono(GLYPH[g],2)}</button>`:`<span class="nav ${cls} off" aria-hidden="true">${mono(GLYPH[g],2)}</span>`;
  const strip=o.tabs?`<div class="tabstrip multi" role="tablist" aria-label="開いているタブ"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>${o.tabs.map(t=>`<button role="tab" id="svc-${t.id}" class="btab" data-act="svc" data-s="${t.id}" aria-selected="${!!t.on}" title="${esc(t.title)}"><span class="bfav">${t.fav}</span><span class="btitle">${esc(t.title)}</span>${t.guide?GUIDE:''}</button>`).join('')}<span class="bplus" aria-hidden="true">${mono(GLYPH.plus,1.5)}</span></div>`
    :`<div class="tabstrip" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="btab"><span class="bfav">${o.fav||spr(IC.shop,1,'')}</span><span class="btitle">${esc(o.title)}</span><span class="bx">${mono(GLYPH.x,1.5)}</span></span><span class="bplus">${mono(GLYPH.plus,1.5)}</span></div>`;
  return `<div class="browser${o.evil?' evil':''}">
    ${strip}
    <div class="chrome">${nb('back','back',o.back,'前のページに戻る')}${nb('fwd','fwd')}${nb('reload','rel',o.reload,'再読み込み')}${addr}<span class="nav kebab off" aria-hidden="true">${mono(GLYPH.more,2)}</span></div>
    <div class="viewport" data-k="${o.k}"${o.site?` data-site="${o.site}"`:''}>${page}</div></div>`;
}
// メインのディスプレイ（.pc.fill）のページは、画面の中でスクロールする。描き直しても位置を保つ（ページごと。日が変わったら先頭から）
let pcScroll={};
const pcMain=p=>p.querySelector('.pc.fill .viewport');
['p-shop','p-console'].forEach(id=>$(id).addEventListener('scroll',e=>{const v=e.target;if(v===pcMain($(id)))pcScroll[v.dataset.k]=v.scrollTop;},true));
// その日の題材（data-focus：お会計・レビュー・会員DBなど）が見える位置へ、画面の中をスクロールする
function pcFocus(p){
  const v=!p.hidden&&pcMain(p),f=v&&v.querySelector('[data-focus]');if(!f)return;
  const bar=v.querySelector('.subs');   // 上に貼りつく小メニューのぶん、下げる
  v.scrollTop=Math.max(0,f.getBoundingClientRect().top-v.getBoundingClientRect().top+v.scrollTop-(bar?bar.offsetHeight:0)-6);
  pcScroll[v.dataset.k]=v.scrollTop;
}
function pcRestore(p){
  if(p.hidden)return;
  const v=pcMain(p);if(!v)return;
  if(pcScroll[v.dataset.k]!=null)v.scrollTop=pcScroll[v.dataset.k];
  else pcFocus(p);   // 最初は、題材が見える位置から
}

function storeDemoHTML(){
  const o=DAYS[S.day].demo;if(demoOff())return '';
  const hashed=S.cfg.code.hash==='bcrypt';const ran=!!S.storeRes;
  const salt=['u7QaRf','K3xLm9','9Zpv2T'];
  const val=(m,i)=>hashed?('$2b$12$'+salt[i%3]+'Hn3b8e1cVrT0pS6wZ2x4qO'):m.pw;
  const pad=(x,w)=>{x=String(x);return x+' '.repeat(Math.max(0,w-x.length));};
  const vals=o.members.map((m,i)=>val(m,i));
  const ew=Math.max(5,...o.members.map(m=>m.mail.length));
  const pw=Math.max(8,...vals.map(v=>v.length));
  const bar='+'+'-'.repeat(ew+2)+'+'+'-'.repeat(pw+2)+'+';
  let table=bar+'\n| '+pad('email',ew)+' | '+pad('password',pw)+' |\n'+bar+'\n';
  o.members.forEach((m,i)=>{table+='| '+pad(m.mail,ew)+' | '+pad(vals[i],pw)+' |\n';});
  table+=bar;
  const SQL='SELECT email, password FROM members;';
  let body=`<span class="tp">app@shop-server-01:~$</span> mysql -u app -p shop\n<span class="tdim">Welcome to the MySQL monitor.  Server version: 8.0.36</span>\n`;
  if(ran){
    body+=`<span class="tp">mysql&gt;</span> ${SQL}\n${table}\n<span class="tdim">${o.members.length} rows in set (0.00 sec)</span>\n<span class="tp">mysql&gt;</span> <span class="cur">▋</span>`;

function netMove(l,sn,kind){

function netPath(pk,tapX,carrier){
  const P=k=>k==='attacker'?[tapX,NG.AY]:[NG.X[k],NG.WY];
  let pts,lag=pk.lag||0;
  if(pk.a!=='attacker'&&pk.b!=='attacker')pts=[P(pk.a),P(pk.b)];
  else{
    const w=pk.a==='attacker'?pk.b:pk.a,via=NG.X[w]===tapX?[]:[[tapX,NG.WY]];
    if(pk.stop){
      if(pk.a!=='attacker'&&!via.length)return null;            // 標的から出る前に止められる＝パケットは見えず、盾だけ光る
      pts=pk.a==='attacker'?[P('attacker'),[tapX,NG.SY+18]]:[P(w),...via,[tapX,NG.SY-18]];
    }else if(pk.copy&&via.length&&carrier){                      // 盗み見：お客さんの通信が取り付き点を通る瞬間に、写しが分かれて落ちる
      pts=[via[0],P('attacker')];lag+=Math.abs(tapX-NG.X[w])/carrier.len*carrier.ms;
    }else pts=pk.a==='attacker'?[P('attacker'),...via,P(w)]:[P(w),...via,P('attacker')];
  }
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  let ms=Math.round(Math.min(700,Math.max(420,len*2.1)));
  if(pk.a==='attacker'||pk.b==='attacker')ms=Math.max(ms,pk.stop?560:760);   // 攻撃者まわりは見せ場なのでゆっくり
  return {pts,len,ms,lag:Math.round(lag)};
}

function netLine(st){
  if(st.reveal)return `<div class="lh atk"><span class="af">${castSpr(attackerOf().id||'tochou',2,'')}</span><span>攻撃者の画面</span></div>`;

function renderNet(){
  const el=$('p-net'),d=DAYS[S.day]||{},kind=atkKind(d),c=S.cfg;
  if(!((S.phase==='incident'||S.phase==='fix'||S.phase==='clear')&&d.check)){
    const pre=S.phase==='intro'||S.phase==='setup'||S.phase==='day0';
    el.innerHTML=`<h2>通信のようす</h2><p class="muted small">${pre?'リリースすると、ここに通信のようすが表示されます。':NET_IDLE}</p>${netSVG({kind,https:!!c.https,tube:true,idle:true})}`;
    return;
  }
  // 再生中は開始位置まで（攻撃者はまだいない）。止まっているときは最後に再生した結果。まだ一度も再生していなければ何も起きていない図
  const L=S.last&&S.last.lines?Object.assign({blocked:false,https:!!c.https,pkt:''},S.last):null;
  const sn=evPlaying?evSn:(L||(S.phase==='incident'?null:netSnap(d,c))),done=!evPlaying&&!!sn;
  const v={kind,https:sn?sn.https:!!c.https,tube:!evPlaying||evFrom>0,atk:done,def:done&&(sn.ok||sn.blocked),warn:done&&sn.blocked,broken:done&&!sn.ok&&!sn.blocked&&kind==='wifi'&&sn.https};
  const lines=(done?netSteps(sn,kind):evPlaying?evSteps.slice(0,evFrom):[]).map(netLine).join('');
  el.innerHTML=`<h2>通信のようす</h2><p class="muted small" id="netSub">${S.phase==='incident'?NET_IDLE:NET_SUB[kind]}</p>${netSVG(v)}
    <div class="netlog" id="netLog" aria-live="polite"><div class="lh">通信ログ</div>${lines}</div>`;
  const lg=$('netLog');lg.scrollTop=lg.scrollHeight;
}

/* ---------- 通信の再生 ---------- */
function netStop(){clearTimeout(evTimer);evTimer=null;evT.forEach(clearTimeout);evT=[];evPlaying=false;busy=false;evOnEnd=null;evSn=null;evSteps=null;renderFab();}
function netPlay(onEnd){
  if(evPlaying)return;
  const d=DAYS[S.day];
  evSn=netSnap(d,S.cfg);evSteps=netSteps(evSn,atkKind(d));evJ=0;evOnEnd=onEnd||null;evPlaying=true;busy=true;renderFab();
  // 確かめ直すとき、通信の手順が前回と同じ（暗号化のあり・なしが変わっていない）なら、接続までは省いて「ページを受け取る」から再生する
  const same=S.phase==='fix'&&S.last&&S.last.lines&&S.last.https===evSn.https;
  evFrom=evI=same?Math.max(0,evSteps.findIndex(st=>st.tag==='HTTP'||st.tag==='HTTPS')):0;
  renderNet();netTick();
}
function netDone(){const cb=evOnEnd,sn=evSn;netStop();S.last=sn;save();renderNet();if(cb)cb();}
function netTick(){
  if(!evPlaying)return;
  if(showing||!$('modal').hidden){evTimer=setTimeout(netTick,160);return;}   // 会話やポップアップが出ている間は待つ
  const st=RM?null:evSteps[evI];
  if(!st){netDone();return;}
  const kind=atkKind(DAYS[S.day]),hop=st.hops[evJ];
  if(evJ===0)netStepStart(st);
  const ms=hop?netHop(hop,netTap(kind)):0;
  evTimer=setTimeout(()=>{
    if(hop)netHopEnd(hop);
    if(evJ<st.hops.length-1){evJ++;netTick();return;}
    netStepEnd(st,kind);evI++;evJ=0;
    evTimer=setTimeout(netTick,st.reveal?620:st.atk?640:120);
  },ms);
}
function netStepStart(st){
  const lg=$('netLog');
  if(st.reveal){   // 攻撃者が現れ、標的へ点線が伸びる。伸びきったら「流れ」に切り替える
    const gs=document.querySelectorAll('#netSvg .natk');
    gs.forEach(g=>{g.classList.remove('off');g.classList.add('in');});
    const sub=$('netSub');if(sub)sub.textContent=NET_SUB[atkKind(DAYS[S.day])];
    evT.push(setTimeout(()=>gs.forEach(g=>{g.classList.remove('in');g.classList.add('flow');}),560));
  }
  if(lg){lg.insertAdjacentHTML('beforeend',netLine(st));lg.scrollTop=lg.scrollHeight;}
}
function netStepEnd(st,kind){
  const sn=evSn,q=id=>$(id)||{classList:{add(){},remove(){}}};
  if(st.tube){q('nTube').classList.remove('off');q('nProto').classList.remove('off');}
  if(!st.atk)return;
  if(st.k==='ok'&&(sn.ok||sn.blocked)){q('nShield').classList.remove('off');document.querySelectorAll('#netSvg .natk').forEach(g=>g.classList.add('def'));}
  if(st.k==='bad'){if(sn.blocked)q('nWarn').classList.remove('off');else if(!sn.ok&&kind==='wifi'&&sn.https){q('nTube').classList.add('broken');q('nProto').classList.add('broken');}}
}
function netHop(hop,tapX){
  const layer=$('nPkt');if(!layer)return 0;
  const gs=[];let html='',total=0;
  hop.forEach((pk,i)=>{
    const g=netPath(pk,tapX,gs[0]);gs.push(g);if(!g)return;
    const [x0,y0]=g.pts[0],path='M 0 0'+g.pts.slice(1).map(p=>` L ${(p[0]-x0).toFixed(1)} ${(p[1]-y0).toFixed(1)}`).join('');
    html+=`<g id="nP${i}"${g.lag?' opacity="0"':''}>${netPlace(IC['pk_'+pk.look],x0,y0,2)}<animateMotion id="nM${i}" path="${path}" dur="${(g.ms/1000).toFixed(3)}s" begin="indefinite" fill="freeze" calcMode="linear"/></g>`;
    total=Math.max(total,g.lag+g.ms);
  });
  layer.innerHTML=html;
  gs.forEach((g,i)=>{
    if(!g)return;
    const go=()=>{const el=$('nP'+i),m=$('nM'+i);if(!el||!m)return;el.removeAttribute('opacity');try{m.beginElement();}catch(e){}};
    if(g.lag)evT.push(setTimeout(go,g.lag));else requestAnimationFrame(go);   // 挿入と同じフレームで begin すると動かないことがある
  });
  netHi(hop,true);
  return total||480;
}
function netHi(hop,on){hop.forEach(pk=>[pk.a,pk.b].forEach(k=>{const t=document.querySelector(`#netSvg [data-n="${k}"]`);if(t)t.classList.toggle('on',on);}));}
function netHopEnd(hop){
  netHi(hop,false);
  const layer=$('nPkt');if(layer)layer.innerHTML='';
  hop.forEach(pk=>{   // 届いた合図：止められたら盾が点滅、届いたら相手の枠が一瞬だけ色づく（赤＝被害／緑＝防いだ）
    if(pk.look!=='bad'&&pk.look!=='ok')return;
    if(pk.stop){const sh=$('nShield');if(sh){sh.classList.remove('hit');void sh.getBoundingClientRect();sh.classList.add('hit');}return;}
    const el=document.querySelector(`#netSvg [data-n="${pk.b}"]`),c=pk.look==='bad'?'hb':'hg';
    if(el){el.classList.add(c);evT.push(setTimeout(()=>el.classList.remove(c),340));}
  });
}

// 次に開くとよい管理画面（そのタブに矢印を立てる）。対策がそろっている・まだ攻撃を見ていないときは null
function guideTarget(){
  const c=S.cfg,d=DAYS[S.day];
  if(S.phase==='setup'){
    if(!S.domain||!aRec().some(r=>r.value===SERVER_IP))return {svc:'registrar'};   // ドメインを取る → サーバーの住所を登録する
    return {svc:'cloud',sub:'server'};                                             // リリースする
  }
  if(S.phase!=='fix'||!d||!d.check||d.check(c).ok)return null;
  if(d.fix)return {svc:'hub'};
  if(S.day<=3){   // 通信編：証明書を用意して、HTTPSにする手順を順に
    if(!c.ca||!c.keyMade)return {svc:'cloud',sub:'cert'};
    if(c.ca!=='self'&&!c.issued){
      if(!c.token)return {svc:'ca'};
      const has=(S.dns||[]).some(r=>r.type==='TXT'&&r.name==='_acme-challenge'&&String(r.value).trim().toUpperCase()===c.token);
      return has?{svc:'ca'}:{svc:'registrar'};
    }
    if(!c.installed)return {svc:'cloud',sub:'cert'};
    if(!(c.https&&c.redirect))return {svc:'cloud',sub:'net'};
    return {svc:'cloud',sub:S.day===1?'cert':'net'};   // 入れ方がまずい（1日目は証明書の選び方・設置、2〜3日目は通信設定）
  }
  return {svc:d.svc||'cloud',sub:d.sub};
}

{ // 通信タブを一画面に収めるため、ヘッダーの高さ（日のタイトルが折り返すと変わる）をCSSへ渡す
  const top=document.querySelector('.top'),setH=()=>document.documentElement.style.setProperty('--top-h',top.offsetHeight+'px');
  if(window.ResizeObserver)new ResizeObserver(setH).observe(top);
  window.addEventListener('resize',setH);setH();
  // 会話ウィンドウが出るとログの高さが変わる。最新の行が隠れないよう、末尾へ寄せ直す
  if(window.ResizeObserver)new ResizeObserver(()=>{const l=$('netLog');if(l)l.scrollTop=l.scrollHeight;}).observe($('p-net'));
}
render();
showTitle(false);
})();
</script>
